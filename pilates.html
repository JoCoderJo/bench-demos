 .sym{color:#ffb4ae}
</style>

g single leg bridge tutorial"}, {"id": "bear-hover", "phase": "inter", "name": "All-fours knee hover", "load": "LOCK", "move": {"breath": "Exhale to hover, breathe there, inhale down", "frames": [{"pose": "allfours", "cue": "All springs on. All fours on the carriage, toes tucked under, back flat.", "mark": [172, 80, 9]}, {"pose": "allfours-hover", "cue": "Exhale: lift both knees two fingers off the carriage. Nothing else changes shape.", "mark": [170, 78, 6]}]}, "focus": ["deep core", "arms"], "setup": "All springs on so the carriage cannot move. On hands and knees on the carriage, toes tucked under, back flat.", "cues": ["Exhale: press the hands down and lift both knees two fingers off the carriage.", "Breathe there for 2 to 3 breaths. The back stays flat like a table.", "Inhale: lower the knees without a bump.", "Low belly drawn gently up, ribs wrapped in."], "mistakes": ["Lifting the knees too high so the hips pike up.", "Holding the breath.", "Shoulders sinking toward the ears."], "cautions": ["This loads the abdominal wall against gravity. Any doming: go back to the bird dog.", "Heaviness or pressure downward: lower and rest. Tell your physio if it keeps happening.", "Sore wrists: make fists, or hold the shoulder rests."], "easier": "Hover for one breath only.", "harder": "Hover and lift one foot for a breath, then the other.", "reps": "5 hovers of 2 to 3 breaths", "secs": 75, "yt": "bear hover quadruped knee hover core exercise postpartum"}, {"id": "hundred", "phase": "adv", "name": "The Hundred", "load": "LM", "move": {"breath": "Inhale for 5 pumps, exhale for 5", "frames": [{"pose": "tabletop-curl", "cue": "Curl up to the tips of the shoulder blades, arms hovering."}, {"pose": "hundred", "cue": "Legs extend on a high diagonal, heels together. Lower them only while the back stays heavy."}, {"pose": "hundred-pump", "cue": "Pump long arms from the shoulder: inhale for 5, exhale for 5, ten rounds."}]}, "focus": ["deep core", "breath"], "setup": "As for the Hundr var KEY='pppr.v1', canStore=true;

function defaults(){
  if(!(S.phase in PHI))S.phase='reconnect';
  S.gates=S.gates||{};S.sessions=S.sessions||[];
  S.equip=S.equip||{box:false,jumpboard:false,standing:false};
  S.springs=S.springs||{L:'1 spring',M:'2 springs',H:'3 springs'};
  // #172: the week plan (weekday 0..6 -> a session id, an own id or 'rest') and the sessions built under My own
  S.week=S.week&&typeof S.week==='object'?S.week:{};
  S.own=(Array.isArray(S.own)?S.own:[]).filter(function(o){return o&&o.id&&Array.isArray(o.ids)});
  if(S.live){S.live.ids=(S.live.ids||[]).filter(function(id){return EX[id]});   // a step that no longer exists cannot be resumed
    if(!S.live.ids.length)S.live=null;else S.live.i=Math.max(0,Math.min(S.live.ids.length-1,S.live.i||0))}
}
defaults();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canStore=false}}

// ---------- dates ----------
var DAY=86400000;
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function weekStart(t){var d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}
function addDays(t,n){var d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()}
function shortDate(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function weeksPost(){if(!S.profile||!S.profile.date)return null;var t=new Date(S.profile.date+'T00:00').getTime();
  return isNaN(t)?null:Math.max(0,Math.floor((Date.now()-t)/(7*DAY)))}

// ---------- program helpers ----------
function loadText(code){
  var sp=S.springs, L={L:sp.L,M:sp.M,H:sp.H,LM:sp.L+' to '+sp.M,MH:sp.M+' to '+sp.H}[code];
  var name=X.loads[code]||code;name=name.charAt(0).toUpperCase()+name.slice(1);
  return L?name+' · '+L:name;
}
// a session's exercise list for THIS reformer: kit you do not have is swapped or skipped
function swapKit(ids){
  var out=[];
  ids.forEach(function(id){
    var e=EX[id];
    if(e.needs&&!S.equip[e.needs]){var sw=X.swaps[id];if(sw&&ids.indexOf(sw)<0&&out.indexOf(sw)<0)out.push(sw);return}
    out.push(id);
  });
  return out;
}
function planOf(sid){return swapKit(sessOf(sid).s.exercises)}
// a ready-made session or one built under My own. Own sessions have no SES entry, so everything asks here;
// an own session counts as the highest phase it draws on
function ownOf(sid){return S.own.filter(function(o){return o.id===sid})[0]}
function sessOf(sid){
  if(SES[sid])return SES[sid];
  var o=ownOf(sid),pi=0;if(!o)return null;
  var ids=o.ids.filter(function(id){return EX[id]});
  ids.forEach(function(id){pi=Math.max(pi,PHI[EX[id].phase])});
  return {s:{id:o.id,name:o.name,focus:'My own session',exercises:ids},p:X.phases[pi],own:true};
}
function liveName(){var L=S.live,x=L&&sessOf(L.sid);return L&&L.name||(x?x.s.name:'My session')}
function mainsOf(ph){return ph.sessions.filter(function(s){return s.name!=='Express'&&s.id!=='r-b'})}
function expressOf(ph){return ph.sessions.filter(function(s){return s.name==='Express'})[0]}
function minutesOf(ids){var s=0;ids.forEach(function(id){s+=EX[id].secs+45});return Math.max(5,Math.round(s/60))}
function yt(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q)}
function symNames(ids){return ids.map(function(i){var s=X.safety.stop_signs.filter(function(x){return x.id===i})[0];return s?s.name.toLowerCase():i})}
function inPhase(pid){return S.sessions.filter(function(s){return s.phase===pid})}
function cleanRun(){var n=0;for(var i=S.sessions.length-1;i>=0&&!S.sessions[i].symptoms.length;i--)n++;return n}

// ---------- the coach: what to do today, and why ----------
function coach(){
  var pi=PHI[S.phase], ph=X.phases[pi], ses=S.sessions, last=ses[ses.length-1], today=dayKey(Date.now());
  var r={phase:ph,tone:'go',tag:'Go',why:[],sid:null,done:false};
  var mains=mainsOf(ph), express=expressOf(ph);
  var wk=weeksPost(), minWk=S.profile&&S.profile.birth==='csection'?8:6;
  if(pi>0&&S.profile&&!S.profile.cleared)r.warn='You have not marked provider clearance. Spring-loaded work waits for it: drop back to Reconnect until you are cleared.';
  else if(pi>0&&wk!==null&&wk<minWk)r.warn='You are '+wk+' weeks postpartum. Spring-loaded work normally waits until at least '+minWk+' weeks and your provider\'s clearance.';
  if(last&&last.symptoms.length){
    r.rule=true;   // rule: this pick overrides the week plan for the day
    var serious=last.symptoms.indexOf('pain')>=0||last.symptoms.indexOf('bleeding')>=0;
    if(serious){r.tone='stop';r.tag='Hold';r.sid='r-b';
      r.why.push('Your last check-in flagged '+symNames(last.symptoms).join(' and ')+'. No spring work today.');
      r.why.push('For bleeding or strong pain, call your provider today. The 5-minute reset is fine only if it feels completely comfortable.');
    }else{r.tone='ease';r.tag='Ease back';r.sid=pi>0?X.phases[pi-1].sessions[0].id:'r-b';
      r.why.push('Your last check-in flagged '+symNames(last.symptoms).join(' and ')+', so today drops back a level.');
      r.why.push('If it happens again, or it lingers into daily life, book a pelvic-floor physio before progressing. It is common and treatable.');}
    return r;
  }
  var mine=inPhase(ph.id), lastMain=null;
  for(var i=mine.length-1;i>=0&&!lastMain;i--)mains.forEach(function(m){if(m.id===mine[i].sid)lastMain=m});
  var next=mains[lastMain?(mains.indexOf(lastMain)+1)%mains.length:0];
  r.sid=r.next=next.id;
  if(last&&dayKey(last.t)===today&&(pi===0||last.phase!=='reconnect')){r.rule=r.done=true;r.tag='Done today';r.sid='r-b';
    r.why.push('You have logged a session today. Recovery happens between sessions, so that is enough.');
    r.why.push('If you want something more, the 5-minute reset is always fine.');return r}
  var gap=last?Math.round((new Date(today+'T00:00').getTime()-new Date(dayKey(last.t)+'T00:00').getTime())/DAY):null;
  if(pi>0&&ses.length>1&&gap===1&&last.phase!=='reconnect'&&ses[ses.length-2].phase!=='reconnect'&&dayKey(ses[ses.length-2].t)===dayKey(addDays(last.t,-1))){
    r.rule=true;r.tone='ease';r.tag='Rest day';r.sid='r-b';
    r.why.push('You trained the last two days. Take a rest day: tissue rebuilds on the days off.');
    r.why.push('The 5-minute reset keeps the habit without adding load.');return r}
  if(express&&gap!==null&&gap>7){r.rule=true;r.sid=express.id;r.why.push('It has been '+gap+' days. No catching up: ease back in with the Express session.')}
  else if(express&&last&&last.effort>=8){r.rule=true;r.sid=express.id;r.tone='ease';r.tag='Lighter';r.why.push('Last session felt like '+last.effort+' out of 10. Aim for 5 to 7 while you recover, so today is the Express session. Use the easier options.')}
  else if(!last)r.why.push(pi===0?'Start here: breath and pelvic floor come before any spring work.':'First session: go slowly, read each setup, and use the easier options freely.');
  else r.why.push('Next in your '+ph.name+' rotation. You last did '+(lastMain?lastMain.name:'a different session')+'.');
  r.why.push(ph.per_week);
  var allGates=ph.gates.every(function(g,i){return (S.gates[ph.id]||{})[i]});
  if(allGates&&pi<X.phases.length-1)r.why.push('All your '+ph.name+' gates are ticked. You can move up to '+X.phases[pi+1].name+' below when you feel ready.');
  return r;
}

// ---------- my week: a plan per weekday. The coach's rules above still win on the day ----------
var DAYN=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function todayIdx(){return (new Date().getDay()+6)%7}
// the phase's per-week rhythm as seven picks. From today on, the "main" days follow the coach's rotation
function rhythm(r){
  var ph=r.phase,m=mainsOf(ph),ex=expressOf(ph),t=todayIdx(),k=0,past=0;
  m.forEach(function(x,i){if(x.id===r.next)k=i});
  return ph.rhythm.map(function(x,i){
    if(x==='main')return m[(i<t?past++:i===t&&r.done?k:k++)%m.length].id;
    return x==='express'&&ex?ex.id:x==='rest'?'rest':'r-b'});
}
function dayChoice(i,R){var v=S.week[i];return v==='rest'||v&&sessOf(v)?v:R[i]}
function choiceName(v){var x=v==='rest'?null:sessOf(v);return x?x.s.name:'Rest day'}
function lockedWhy(v){var x=v==='rest'?null:sessOf(v);
  return x&&PHI[x.p.id]>PHI[S.phase]?'Your week plan had '+x.s.name+', which is '+x.p.name+' work. That phase is locked until the gates before it are ticked, so the coach picked for today.':''}
// what today really is: the week plan, unless a coach rule or a locked phase says otherwise (and then why)
function todayPick(){
  var r=coach(),d=todayIdx(),R=rhythm(r),v=dayChoice(d,R),set=v===S.week[d],lock=lockedWhy(v);
  var t={r:r,d:d,R:R,sid:r.sid,rest:false,from:'coach',note:''};
  if(r.rule){if(v==='rest')t.note='Your week plan has a rest day today. That fits: the session below is optional.';
    else if(v!==r.sid)t.note='Your week plan had '+choiceName(v)+' for today. The coach\'s rule above comes first, for today only.'}
  else if(lock)t.note=lock;
  else if(!set&&!S.sessions.length){}   // nothing logged yet: the coach's first session, whatever the weekday
  else if(v==='rest'){t.rest=true;t.sid='r-b';t.from='plan'}
  else{t.sid=v;if(set||v!==r.sid)t.from='plan'}
  return t;
}
function weekCard(t){
  if(UI.pickDay!=null)return dayPicker(UI.pickDay,t.R);
  var w0=weekStart(Date.now()),log={},n=0,rows='',goal=S.phase==='reconnect'?5:3,mine=false;
  S.sessions.forEach(function(x){var k=dayKey(x.t);(log[k]=log[k]||[]).push(x.name)});
  for(var i=0;i<7;i++){
    var done=log[dayKey(addDays(w0,i))],v=dayChoice(i,t.R),own=v===S.week[i],name,sub;if(done)n++;if(own)mine=true;
    if(done){name=done.join(', ');sub='Done'}
    else if(i===t.d){name=t.rest?'Rest day':sessOf(t.sid).s.name;
      sub=t.note?'Changed by the coach for today':t.rest?'Recovery. Tap to change':'about '+minutesOf(planOf(t.sid))+' min'+(own?' · your pick':'')}
    else{name=choiceName(v);sub=(v==='rest'?'Recovery':'about '+minutesOf(planOf(v))+' min')+(own?' · your pick':'')}
    rows+='<button class="opt day'+(i===t.d?' today':i<t.d&&!done?' past':'')+'" data-act="pickday" data-v="'+i+'"><span class="dn">'+DAYN[i].slice(0,3)+'<i class="'+(done?'hit':'')+'"></i></span>'
     +'<span class="txt"><b>'+esc(name)+'</b><span class="dim">'+(i===t.d?'Today · ':'')+esc(sub)+'</span></span><span class="go">›</span></button>'}
  return '<div class="tray" id="myweek"><h2>My week</h2>'+rows
   +'<p class="dim">'+n+' of '+goal+' active days this week'+(n>=goal?'. Goal met, the rest is recovery.':'.')+' Tap a day to change it. The plan repeats every week, and the coach\'s safety rules still come first on the day.</p>'
   +(mine?'<button class="block sm" data-act="weekreset">Back to the coach\'s rhythm for every day</button>':'')+'</div>';
}
function optRow(act,v,tid,title,sub,on){
  return '<button class="opt'+(on?' on':'')+'" data-act="'+act+'" data-v="'+esc(v)+'">'+(tid?thumb(tid):'')+'<span class="txt"><b>'+esc(title)+'</b><span class="dim">'+esc(sub)+'</span></span></button>'}
function sessOpt(sid,on){var x=sessOf(sid),ids=planOf(sid);
  return optRow('setday',sid,midOf(ids),x.s.name,x.s.focus+' · about '+minutesOf(ids)+' min',on)}
function dayPicker(d,R){
  var cur=dayChoice(d,R),set=cur===S.week[d],pi=PHI[S.phase];
  var h='<div class="tray" id="myweek"><h2>My week</h2><h3>'+DAYN[d]+'</h3><p class="dim">Pick what '+DAYN[d]+' looks like. It repeats every week until you change it.</p>';
  if(set)h+=optRow('setday','auto','','Back to the coach\'s rhythm','That would be: '+choiceName(R[d]),false);
  h+=optRow('setday','rest','','Rest day','Recovery. The 5-minute reset stays optional',cur==='rest');
  S.own.forEach(function(o){var x=sessOf(o.id);if(!x.s.exercises.length||PHI[x.p.id]>pi)return;
    h+='<div class="optrow">'+sessOpt(o.id,cur===o.id)+'<button class="sm" data-act="build" data-v="'+esc(o.id)+'">Edit</button></div>'});
  h+=optRow('build','','','Build my own session','Pick the exercises yourself from the Library',false);
  for(var i=pi;i>=0;i--){h+='<h4>'+esc(X.phases[i].name)+'</h4>';X.phases[i].sessions.forEach(function(x){h+=sessOpt(x.id,cur===x.id)})}
  return h+'<button class="block" data-act="pickday" data-v="">Cancel</button></div>';
}

      return '<div class="line">'+thumb(id)+'<div class="txt"><b>'+(i+1)+'. '+esc(e.name)+'</b><br><span class="dim">'+esc(kitNote(e)||e.reps)+'</span></div>'
       +'<button class="sm" data-act="bup" data-v="'+i+'"'+(i?'':' disabled')+' aria-label="Move up">↑</button><button class="sm" data-act="badd" data-v="'+esc(id)+'" aria-label="Remove">✕</button></div>'}).join('')
     :'<p class="dim">Nothing in it yet. Add exercises from the list below. The 360 connection breath is a good first one.</p>')
   +'<button class="pri block" data-act="bsave"'+(B.ids.length?'':' disabled')+'>Save'+(B.day!=null?' and put it on '+DAYN[B.day]:'')+'</button>'
   +'<button class="block sm" data-act="bcancel">Cancel</button>'
   +(B.id?'<button class="block sm" data-act="bdelete">Delete this session</button>':'')+'</div>';
  h+='<div class="tray"><h2>Add exercises</h2><p class="dim">From the phases you have unlocked. Tap one to add it, tap again to take it out. Open the Library to read an exercise in full.</p>';
  for(var i=0;i<=pi;i++){h+='<h4>'+esc(X.phases[i].name)+'</h4>';
    X.exercises.forEach(function(e){if(e.phase!==X.phases[i].id)return;var on=B.ids.indexOf(e.id)>=0;
      h+=optRow('badd',e.id,e.id,(on?'✓ ':'')+e.name,kitNote(e)||loadText(e.load).split(' · ')[0]+' · '+e.reps,on)})}
  return h+'</div>';
}

  return 'Needs '+(e.needs==='standing'?'a standing platform':'a '+e.needs)+': '+(sw?'swapped for '+EX[sw].name:'skipped')+' on your setup'}

function figMark(F,i){
  [].forEach.call(F.box.querySelectorAll('.figcue div'),function(d,j){d.className=j===i?'on':''});
  [].forEach.call(F.box.querySelectorAll('.still'),function(b,j){b.className='still'+(j===i?' on':'')});
  F.box.querySelector('[data-act=figplay]').textContent=F.play?'Pause':'Play';
}
function figGo(F,i,ms){
  if(F.to!=null)F.at=F.to;
  figMark(F,i);F.t0=performance.now();F.ms=ms;
  if(!ms||i===F.at){F.at=i;F.to=null;F.dyn.innerHTML=drawPose(F.K[i]);return}
  F.to=i;figLoop(F);
}
function figNext(F){var n=F.K.length;if(F.m.cycle)return (F.at+1)%n;if(F.at+F.dir<0||F.at+F.dir>=n)F.dir=-F.dir;return F.at+F.dir}
function figLoop(F){
  if(F.on)return;F.on=true;
  requestAnimationFrame(function tick(now){
    if(F!==FIG||!document.body.contains(F.box)){F.on=false;return}   // left this step or closed the exercise: the loop ends
    if(F.to!=null){var t=(now-F.t0)/F.ms;
      if(t>=1){F.at=F.to;F.to=null;F.t0=now;F.dyn.innerHTML=drawPose(F.K[F.at])}
      else F.dyn.innerHTML=drawPose(tween(F.K[F.at],F.K[F.to],t*t*(3-2*t)))}
    else if(!F.play){F.on=false;return}
    else if(now-F.t0>800)figGo(F,figNext(F),1800);
    requestAnimationFrame(tick)});
}

// ---------- bike: tools/bike.js (the Bluetooth link) and tools/ride.js (rides), inlined at build time ----------
// bike.js — the Bike tab: a ProForm Tour de France CBC over Web Bluetooth (Chrome on Android).
// dashboard.py inlines this file into the page; tools/test_bike.js runs the IFIT half under node.
//
// The bike speaks iFit's "FitPro" protocol, not the standard fitness-machine profile:
//   BLE packets (<= 20 bytes)   header  fe 02 <msg_len> <data packets + 1>
//                               data    <seq> <n> <n bytes>      seq 00, 01, ... and ff on the last
//   message  = 02 04 02 <cmd_len> <command>                      (responses start 01 04 02)
//   command  = <device> <len> <cmd> <content...> <checksum>      checksum = sum of the rest & ff
//   response = <device> <len> <cmd> <status> <data...> <checksum>   status 02 done, 04 failed, 08 locked
// Resistance writes are refused (status 08) until VerifySecurity is sent with a hash computed from
// the serial, model and part numbers the bike reports. The board relocks on its own, so a locked
// write unlocks again and retries once. Never send cmd 0x09 (Update) or 0x38 (EnterBootloader).
var IFIT=(function(){
  var SERVICE='00001533-1412-efde-1523-785feabcd123', WRITE='00001534-1412-efde-1523-785feabcd123',
      NOTIFY='00001535-1412-efde-1523-785feabcd123';
  var DEV_MAIN=2, DEV_BIKE=7;
  var CMD={READ_WRITE:0x02,SUPPORTED_DEVICES:0x80,DEVICE_INFO:0x81,SYSTEM_INFO:0x82,VERSION_INFO:0x84,
           SUPPORTED_COMMANDS:0x88,VERIFY_SECURITY:0x90,SERIAL_NUMBER:0x95};
  var ST={DONE:2,FAILED:4,LOCKED:8};
  // field id -> [name, bytes]. A response is just the values packed in ascending id order, so only
  // fields whose size is known can be asked for, and the board rejects a frame with an unknown field.
  var FIELDS={2:['resistance',2],3:['watts',2],4:['distance',4],5:['rpm',2],16:['kph',2],42:['maxLevel',1]};
  var TELEMETRY=[2,3,4,5,16];

  function checksum(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s&255}
  function le(v,n){var o=[];for(var i=0;i<n;i++){o.push(v%256);v=Math.floor(v/256)}return o}
  function rd(a,at,n){var v=0;for(var i=n-1;i>=0;i--)v=v*256+a[at+i];return v}
  function hex(a){return [].map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join(' ')}
  function command(dev,cmd,content){var b=[dev,(content||[]).length+4,cmd].concat(content||[]);return b.concat([checksum(b)])}
  function message(c){return [2,4,2,c.length].concat(c)}
  function packetize(m){var out=[[0xfe,2,m.length,Math.ceil(m.length/18)+1]];
    for(var i=0;i<m.length;i+=18){var c=m.slice(i,i+18);out.push([i+18>=m.length?0xff:i/18,c.length].concat(c))}
    return out}
  function framesFor(dev,cmd,content){return packetize(message(command(dev,cmd,content)))}
  function maskBytes(ids){if(!ids.length)return [0];
    var m=[],n=Math.floor(Math.max.apply(null,ids)/8)+1;for(var i=0;i<n;i++)m.push(0);
    ids.forEach(function(f){m[Math.floor(f/8)]|=1<<(f%8)});return [n].concat(m)}
  function rwContent(writes,reads){var ids=Object.keys(writes||{}).map(Number).sort(function(a,b){return a-b}),out=maskBytes(ids);
    ids.forEach(function(f){out=out.concat(le(writes[f],FIELDS[f][1]))});
    return out.concat(maskBytes((reads||[]).slice().sort(function(a,b){return a-b})))}
  function parseFields(data,ids){var v={},at=0;
    ids.slice().sort(function(a,b){return a-b}).forEach(function(f){var n=FIELDS[f][1];
      if(at+n>data.length)throw new Error('short response for field '+f+': '+hex(data));
      v[FIELDS[f][0]]=rd(data,at,n);at+=n});
    return v}
  function levelToRaw(l){return 625*l-63}             // 16 levels over the board's 0..10000 scale
  function rawToLevel(r){return Math.max(1,Math.round((r+63)/625))}
  function securityHash(serial,part,model){
    if(part===370357&&model===39915)part=374677;      // one production run reports the wrong part number
    var sw=((part<<16)|(part>>>16))>>>0,out=[];
    for(var b=0;b<32;b++){var h=(b+1)&255;
      if((serial>>>b)&1)h^=((b<16?sw>>>b:part>>>b)&255);else h^=(h*(b+model))%256;
      out.push(h)}
    return out}
  function unlockContent(serial,part,model,lib){return securityHash(serial,part,model).concat(le(8*lib,4))}
  function Reassembler(){this.want=null;this.buf=[]}
  Reassembler.prototype.reset=function(){this.want=null;this.buf=[]};
  Reassembler.prototype.feed=function(p){
    if(p.length>=4&&p[0]===0xfe&&p[1]===2){this.want=p[2];this.buf=[];return null}
    if(this.want==null||p.length<2)return null;
    this.buf=this.buf.concat([].slice.call(p,2,2+p[1]));   // the rest of a notify packet is stale padding
    if(p[0]!==0xff)return null;
    var m=this.buf,w=this.want;this.reset();
    if(m.length!==w)throw new Error('length mismatch: header said '+w+', got '+m.length);
    return m};
  function parseMessage(m){if(m.length<9||m[1]!==4||m[2]!==2)throw new Error('bad message: '+hex(m));
    var c=m.slice(4,4+m[3]);
    return {raw:c,device:c[0],cmd:c[2],status:c[3],data:c.slice(4,-1),ok:c[3]===ST.DONE,sumOk:checksum(c.slice(0,-1))===c[c.length-1]}}
  return {SERVICE:SERVICE,WRITE:WRITE,NOTIFY:NOTIFY,DEV_MAIN:DEV_MAIN,DEV_BIKE:DEV_BIKE,CMD:CMD,ST:ST,FIELDS:FIELDS,TELEMETRY:TELEMETRY,
    checksum:checksum,le:le,rd:rd,hex:hex,command:command,message:message,packetize:packetize,framesFor:framesFor,maskBytes:maskBytes,
    rwContent:rwContent,parseFields:parseFields,levelToRaw:levelToRaw,rawToLevel:rawToLevel,securityHash:securityHash,
    unlockContent:unlockContent,Reassembler:Reassembler,parseMessage:parseMessage};
})();

    all().forEach(function(r){var bad=r.errors.length,lv=r.segs.map(function(s){return s.level});
      h+='<div class="card"><div class="row between" style="flex-wrap:nowrap"><span><b>'+esc(r.name)+'</b><br><span class="dim">'
        +(bad?'needs fixing':Math.round(r.end/60)+' min · levels '+Math.min.apply(null,lv)+' to '+Math.max.apply(null,lv)+(r.video?' · '+(F.ytId(r.video)?'YouTube':'linked session'):''))
        +(r.about?' · '+esc(r.about):'')+'</span></span><span class="row" style="flex-wrap:nowrap">'
        +(bad?'':'<button class="sm pri" data-act="rdstart" data-v="'+esc(r.id)+'">Start</button>')
        +'<button class="sm" data-act="rdedit" data-v="'+esc(r.id)+'">'+(r.builtin?'Copy':'Edit')+'</button></span></div>'+(bad?'':profile(r,false))+'</div>'});
    h+='<div class="row" style="margin-top:10px"><button data-act="rdnew">New ride</button></div></div>';
    var H=st().rides.slice(-6).reverse();
    if(H.length)h+='<div class="tray"><h2>Ride history</h2>'+H.map(function(x){
      return '<div class="card"><b>'+esc(x.name)+'</b> <span class="dim">'+esc(new Date(x.t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))+'</span><br><span class="dim">'
        +[x.min+' min',x.w!=null?x.w+' W avg':'',x.rpm!=null?x.rpm+' rpm':'',x.km!=null?x.km+' km':'',x.top?'top level '+x.top:'',x.done?'':'ended early'].filter(Boolean).join(' · ')+'</span></div>'}).join('')+'</div>';
    return h}

  document.addEventListener('input',function(ev){if(ev.target.id!=='rd-text'||!R.edit)return;
    R.edit.text=ev.target.value;if($('rd-errs'))$('rd-errs').innerHTML=errList(F.parse(R.edit.text))});
  var act={
    rdstart:function(id){var r=all().filter(function(x){return x.id===id})[0];if(r&&!r.errors.length)begin(r,'play')},
    rdtoggle:function(){if(!R.ride)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}setRun(!going());tick()},
    rdnudge:function(v){if(!R.ride)return;R.off+=Number(v);tick()},
    rdend:function(){if(R.ride&&(R.mode==='rec'||T()<60||confirm('End this ride now?')))finish()},
    rdnew:function(){R.msg='';R.edit={id:'',text:NEW};repaint()},
    rdedit:function(id){var r=all().filter(function(x){return x.id===id})[0];if(!r)return;R.msg='';
      R.edit=r.builtin?{id:'',text:F.toText(r)}:{id:id,text:st().myrides.filter(function(m){return m.id===id})[0].text};repaint()},
    rdsave:function(){var e=R.edit;if(!e||F.parse(e.text).errors.length)return;var L=st().myrides,m={id:e.id||'ride-'+Date.now(),text:e.text},
      k=L.map(function(x){return x.id}).indexOf(m.id);if(k>=0)L[k]=m;else L.push(m);save();R.edit=null;R.msg='';repaint()},
    rdcancel:function(){R.edit=null;R.msg='';repaint()},
    rddelete:function(){var e=R.edit;if(!e||!confirm('Delete this ride?'))return;S.myrides=st().myrides.filter(function(m){return m.id!==e.id});save();R.edit=null;repaint()},
    rdrec:function(){var e=R.edit;if(!e)return;
      if(!on()){R.msg='Connect the bike first: recording listens to the level buttons.';return repaint()}
      var p=F.parse(e.text);begin({id:e.id,name:p.name,video:p.video,segs:[{t:0,level:(BIKE.state.last&&BIKE.state.last.level)||1,cue:''}],end:0,errors:[]},'rec')}
  };
  return {top:top,list:list,act:act,state:R,video:function(){return V},rendered:function(){place();paint()}};
})();

}

   feedback bubble on the Bike tab (and on Next during a session: that Back/Next bar is sticky, so no

nav#nav{padding-right:52px}
#bfb-btn{width:40px !important;height:40px !important;font-size:18px !important;right:6px !important;
  bottom:calc(2px + env(safe-area-inset-bottom)) !important}

</style><script id="bench-release">window.BENCH_RELEASE="pilates 1.0.0+ea5e471";</script>
<a id="bench-release-pill" href="/releases.html#pilates" title="release notes" style="position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2147483000;font:11px/1 ui-monospace,Menlo,Consolas,monospace;color:#9aa4b2;background:rgba(20,23,28,.72);border:1px solid #2a3039;border-radius:999px;padding:5px 8px;text-decoration:none;opacity:.85">v1.0.0</a><!-- Public demo feedback bubble. Injected into every page of the demo site by
     publish-demos-site.sh. Posts to Netlify Forms (static host, no backend, nothing
     touching the Bench or the tailnet). Submissions land in Netlify → Forms.
     The hidden <form> below is what Netlify parses at deploy time to register the
     form; the visible UI posts to "/" by AJAX with the same field names. -->
<form name="demo-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="form-name" value="demo-feedback">
  <input type="text" name="bot-field">
  <input type="text" name="demo">
  <input type="text" name="kind">
  <input type="text" name="release">
  <input type="text" name="contact">
  <textarea name="message"></textarea>
</form>
<div id="bench-fb"></div>
<script>
(function () {
  if (window.__benchFb) return; window.__benchFb = 1;
  var Z = 2147483000, open = false, sending = false;
  // Everyone shares one passcode, so a note is anonymous unless the tester says who they are.
  // Hand each person a link like  https://…/?who=jane  and the name rides along automatically;
  // it is remembered on that device, and they can still overwrite it in the box.
  var WHO_KEY = 'bench-who';
  var who = '';
  try {
    var q = new URLSearchParams(location.search).get('who');
    if (q) { who = q.slice(0, 40); localStorage.setItem(WHO_KEY, who); }
    else { who = localStorage.getItem(WHO_KEY) || ''; }
  } catch (e) {}

  var demo = (function () {
    var p = location.pathname;
    if (p.indexOf('/manito') === 0) return 'Manito Park App';
    if (p.indexOf('/rover') === 0) return 'Rover Bot';
    if (p.indexOf('/scam') === 0) return 'Voice AI Scam Filter';
    return 'Demos home';
  })();

  var css = document.createElement('style');
  css.textContent =
    '#bfb-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:' + Z + ';' +
      'width:54px;height:54px;border-radius:50%;border:0;background:#c9a24b;color:#14171c;font-size:24px;' +
      'line-height:1;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.45)}' +
    '#bfb-btn:active{transform:scale(.95)}' +
    '#bfb-wrap{position:fixed;inset:0;z-index:' + (Z + 1) + ';background:rgba(0,0,0,.6);display:flex;' +
      'align-items:flex-end;justify-content:center;padding:16px}' +
    '#bfb-card{width:100%;max-width:430px;background:#12161c;color:#e6e8ea;border:1px solid #262b33;' +
      'border-radius:16px;padding:18px;max-height:88vh;overflow:auto;' +
      'font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}' +
    '#bfb-card h3{margin:0 0 3px;font-size:18px}' +
    '#bfb-card p.sub{margin:0 0 13px;font-size:13px;color:#9aa4b2}' +
    '#bfb-card label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;' +
      'color:#9aa4b2;margin:11px 0 4px}' +
    '#bfb-card input,#bfb-card textarea,#bfb-card select{width:100%;background:#0d1014;color:#e6e8ea;' +
      'border:1px solid #262b33;border-radius:10px;padding:11px 12px;font-size:16px}' +
    '#bfb-card textarea{min-height:104px;resize:vertical}' +
    '#bfb-row{display:flex;gap:9px;margin-top:14px}' +
    '#bfb-row button{flex:1;padding:12px;border-radius:10px;font:600 14px system-ui,sans-serif;cursor:pointer}' +
    '#bfb-cancel{background:transparent;color:#9aa4b2;border:1px solid #262b33}' +
    '#bfb-send{background:#c9a24b;color:#14171c;border:0}' +
    '#bfb-msg{font-size:13px;margin-top:10px;color:#9aa4b2}';
  document.head.appendChild(css);

  var btn = document.createElement('button');
  btn.id = 'bfb-btn'; btn.type = 'button';
  btn.setAttribute('aria-label', 'Send feedback');
  btn.textContent = '💬';
  document.body.appendChild(btn);

  function close() { var w = document.getElementById('bfb-wrap'); if (w) w.remove(); open = false; }

  btn.onclick = function () {
    if (open) return close();
    open = true;
    var wrap = document.createElement('div');
    wrap.id = 'bfb-wrap';
    wrap.innerHTML =
      '<div id="bfb-card">' +
        '<h3>Tell us what you found</h3>' +
        '<p class="sub">' + demo + ' — bugs, confusing bits, or things you wish it did.</p>' +
        '<label>What kind of note is this?</label>' +
        '<select id="bfb-kind">' +
          '<option>Something is broken</option>' +
          '<option>Something is confusing</option>' +
          '<option>Idea / feature request</option>' +
          '<option>It worked well</option>' +
        '</select>' +
        '<label>What happened?</label>' +
        '<textarea id="bfb-text" placeholder="As specific as you can — what you tapped, what you expected, what you got."></textarea>' +
        '<label>Who is this? (so we can follow up)</label>' +
        '<input id="bfb-contact" autocomplete="off" placeholder="so we know who this came from">' +
        '<div id="bfb-row"><button id="bfb-cancel" type="button">Cancel</button>' +
        '<button id="bfb-send" type="button">Send</button></div>' +
        '<div id="bfb-msg"></div>' +
      '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
    document.getElementById('bfb-cancel').onclick = close;
    if (who) document.getElementById('bfb-contact').value = who;
    document.getElementById('bfb-text').focus();

    document.getElementById('bfb-send').onclick = function () {
      if (sending) return;
      var text = document.getElementById('bfb-text').value.trim();
      var msg = document.getElementById('bfb-msg');
      if (text.length < 4) { msg.textContent = 'Add a little more detail first.'; return; }
      sending = true; msg.textContent = 'Sending…';
      var body = new URLSearchParams({
        'form-name': 'demo-feedback',
        'demo': demo,
        'kind': document.getElementById('bfb-kind').value,
        'release': String(window.BENCH_RELEASE || '').slice(0, 60),   // "phonics 1.0.0+eb48367", stamped by publish-demos-site.sh
        'contact': document.getElementById('bfb-contact').value.slice(0, 120),
        'message': text.slice(0, 4000)
      }).toString();
      fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
        .then(function (r) {
          sending = false;
          if (!r.ok) throw new Error(r.status);
          document.getElementById('bfb-card').innerHTML =
            '<h3>Thank you — got it.</h3><p class="sub">That goes straight to the two of us building this.</p>' +
            '<div id="bfb-row"><button id="bfb-send" type="button">Close</button></div>';
          document.getElementById('bfb-send').onclick = close;
        })
        .catch(function () {
          sending = false;
          msg.textContent = 'Could not send — check your connection and try again.';
        });
    };
  };
})();
</script></body>
