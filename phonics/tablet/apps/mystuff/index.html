<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Stuff</title>
<!--
  My Stuff — one per-kid gallery over the stores the other tiles already keep (PLAN §12 C6, D-031). READ ONLY: nothing is
  deleted or edited here (that stays in the owning app); a kid looks at what is theirs and jumps to the app that makes more.
    📷 Pictures      /api/store/camera/<kid>/<id>.jpg (+ <id>.t.jpg thumb)  and the maker photos  maker/<kid>/built-*.jpg
    🎤 Show-and-tell /api/store/show-tell/<kid>/<id>.json {word,label,conf,t} + <id>.jpg
    ⭐ Stars         words|read|count|music /<kid>/progress.json {stars, built|read|counted|songs:{key:n}}
    💡 Light Lab     /api/store/maker-light/<kid>/pic-<t>.json {rows:[…13-char strings…], t}
    🔩 Makes         /api/store/maker/<kid>/proj-*.json (DESIGN_CONTRACT §1: name, stage, design.template, ticket.status, photos)
  Who = the launcher's hello (kid.id, D-008); a kid switch reloads everything. On a laptop (file://, static demo) the same
  localStorage fallbacks the other tiles write are read (show-tell.<kid>, kt-light-<kid>, <app>.progress.<kid>, camera).
  Tap-first (D-009): chips = sections, tap a picture = big view, ◁ closes the big view (handled) else the launcher goes home.
  Pre-reader (age < 5): no small captions, just the pictures and the words. window.MS = test hook (tests/mystuff_dom.py).
-->
<style>
:root{--bg:#10201c;--panel:#18302a;--cell:#1f3b33;--ink:#f1f7f4;--dim:#9dbbb1;--on:#2e8b7a;--star:#ffcf5a;--warn:#ff8a80;--ok:#43b581}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:20px/1.3 system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#top{display:flex;align-items:center;gap:14px;padding:12px 18px 6px}
#top .av{font-size:44px;line-height:1}
#top h1{margin:0;font-size:30px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tot{font-size:26px;font-weight:800;color:var(--star);white-space:nowrap}
#chips{display:flex;gap:10px;padding:6px 18px 10px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;height:64px;padding:0 18px;border-radius:32px;background:var(--panel);border:3px solid transparent;font-size:22px;font-weight:700}
.chip .ic{font-size:30px}.chip .n{min-width:34px;height:34px;border-radius:17px;background:var(--cell);display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--dim)}
.chip.on{border-color:var(--on);background:#21473d}.chip.zero{opacity:.55}
#body{position:absolute;top:150px;bottom:0;left:0;right:0;overflow-y:auto;padding:4px 18px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pic{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--cell);border:3px solid transparent}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .tag{position:absolute;left:10px;top:8px;font-size:26px;filter:drop-shadow(0 1px 2px #0008)}
.pic .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(#0000,#000a);font-size:24px;font-weight:800;text-align:left}
.pic .sub{display:block;font-size:14px;font-weight:500;color:#ddd}
.pre .sub{display:none}
.row{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.row .ic{font-size:40px;width:56px;text-align:center}.row .l{flex:1;min-width:0}.row .l b{font-size:24px;display:block}.row .l small{color:var(--dim);font-size:16px}
.row .st{font-size:26px;font-weight:800;color:var(--star);white-space:nowrap}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.words span{background:var(--cell);border-radius:12px;padding:6px 12px;font-size:20px;font-weight:700}
.led{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;aspect-ratio:13/8;padding:8px;background:#000;border-radius:14px}
.led i{display:block;border-radius:50%;background:#1a1a1a}.led i.on{background:#ff4d4d;box-shadow:0 0 6px #ff4d4d}
.proj{background:var(--panel);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.proj .h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.proj .h b{font-size:24px;flex:1;min-width:0}
.pill{display:inline-block;padding:4px 12px;border-radius:14px;background:var(--cell);font-size:16px;font-weight:700;color:var(--dim)}
.pill.printed,.pill.done{color:var(--ok)}.pill.asked,.pill.queued,.pill.printing{color:var(--star)}.pill.declined{color:var(--warn)}
.proj .stages{display:flex;gap:4px;margin-top:10px}.proj .stages i{flex:1;height:8px;border-radius:4px;background:var(--cell)}.proj .stages i.on{background:var(--on)}
.proj .msg{color:var(--dim);font-size:17px;margin-top:6px}
.proj .ph{display:flex;gap:10px;margin-top:10px}.proj .ph .pic{width:160px;flex:none}
.empty{text-align:center;padding:40px 20px 20px;color:var(--dim)}
.empty .big{font-size:84px;line-height:1;margin-bottom:12px}
.empty p{margin:0 0 20px;font-size:22px}
.go{display:inline-flex;align-items:center;gap:10px;height:66px;padding:0 26px;border-radius:33px;background:var(--on);color:#fff;font-size:24px;font-weight:800}
#big{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
#big.on{display:flex}
#big img{max-width:100%;max-height:78%;border-radius:16px;object-fit:contain}
#big .led{width:min(90vw,calc(70vh * 13 / 8))}
#big .cap{font-size:40px;font-weight:800;color:#fff}
#big .x{position:absolute;top:12px;right:16px;width:64px;height:64px;border-radius:32px;background:#fff3;font-size:30px}
</style></head><body>
<div id="top"><span class="av" id="av">🎒</span><h1 id="who">My stuff</h1><span class="tot" id="tot"></span></div>
<div id="chips"></div>
<div id="body"></div>
<div id="big"><button class="x" id="bigX" aria-label="close">✕</button><div id="bigIn"></div><div class="cap" id="bigCap"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIVE=location.protocol.startsWith('http');
const AV={frog:'🐸',fox:'🦊',cat:'🐱',owl:'🦉',bunny:'🐰',dino:'🦖',bear:'🐻',star:'⭐'};
const STAGES=['idea','plan','build','code','design','check','make','attach','show'];
const SECS=[
  {id:'photos',ic:'📷',name:'Pictures',app:'camera',appName:'Camera',hint:'Take a picture!'},
  {id:'show',ic:'🎤',name:'Show and tell',app:'show-tell',appName:'Show and Tell',hint:'Show me something!'},
  {id:'stars',ic:'⭐',name:'Stars',app:'words',appName:'Word Builder',hint:'Play a game to earn stars!'},
  {id:'light',ic:'💡',name:'Light Lab',app:'maker-light',appName:'Light Lab',hint:'Make a light picture!'},
  {id:'maker',ic:'🔩',name:'Makes',app:'maker-cad',appName:'3D Design',hint:'Design something to print!'}];
const GAMES=[{app:'words',ic:'🔤',name:'Word Builder',key:'built',unit:'words built'},{app:'read',ic:'📖',name:'Read It',key:'read',unit:'lines read'},
  {app:'count',ic:'🔢',name:'Count With Me',key:'counted',unit:'numbers counted'},{app:'music',ic:'🎹',name:'Music Pads',key:'songs',unit:'songs played'}];
let kid={id:'default',name:'',age:5,avatar:'frog'},tab=null,D=null,seq=0,bigOpen=false;
window.MS={get state(){return {kid:kid.id,tab,big:bigOpen,counts:D?counts():null,loaded:!!D};}};
const kt=m=>{try{parent.postMessage(m,'*');}catch(e){}};
const base=app=>'/api/store/'+encodeURIComponent(app)+'/'+encodeURIComponent(kid.id)+'/';
async function files(app){try{const r=await fetch(base(app),{cache:'no-store'});if(!r.ok)return [];const j=await r.json();return (Array.isArray(j)?j:(j.files||[])).map(e=>typeof e==='string'?e:e.name);}catch(e){return [];}}
async function json(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():null;}catch(e){return null;}}
const ls=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
// ---- loaders: each answers [] / {} and never throws; the whole page is one Promise.all so a slow store never blocks a section
async function loadPhotos(){
  if(LIVE){const names=new Set(await files('camera'));
    const cam=[...names].filter(n=>/^\d+\.jpg$/.test(n)).map(n=>n.slice(0,-4)).sort((a,b)=>b-a).map(id=>({id:'c'+id,tag:'',url:base('camera')+id+'.jpg',thumb:base('camera')+(names.has(id+'.t.jpg')?id+'.t.jpg':id+'.jpg'),t:+id}));
    const mk=(await files('maker')).filter(n=>/^built-.*\.(jpg|jpeg|png|webp)$/i.test(n)).sort().reverse().map(n=>({id:'m'+n,tag:'🔩',url:base('maker')+n,thumb:base('maker')+n,t:0}));
    return cam.concat(mk);}
  const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!/camera/.test(k)||!k.includes(kid.id))continue;const l=ls(k)||{};
    for(const id of Object.keys(l).sort((a,b)=>b-a))if(l[id]&&l[id].full)out.push({id:'c'+id,tag:'',url:l[id].full,thumb:l[id].thumb||l[id].full,t:+id});}
  return out;
}
async function loadShow(){
  if(LIVE){const names=new Set(await files('show-tell'));const ids=[...names].filter(n=>/^\d+\.json$/.test(n)).map(n=>n.slice(0,-5)).sort((a,b)=>b-a).slice(0,40);
    const out=[];for(const id of ids){const m=await json(base('show-tell')+id+'.json');if(m)out.push({id,word:m.word||'',label:m.label||'',img:names.has(id+'.jpg')?base('show-tell')+id+'.jpg':''});}return out;}
  const l=ls('show-tell.'+kid.id)||{};return Object.keys(l).sort((a,b)=>b-a).map(id=>({id,word:l[id].word||'',label:l[id].label||'',img:l[id].img||''}));
}
let READ_TEXT=null;      // Read It keeps line ids (s0…); its own data.json in the bundle turns them back into the sentence
async function readText(){if(READ_TEXT)return READ_TEXT;const d=await json('../read/data.json');READ_TEXT={};for(const l of (d&&d.lines)||[])if(l.id)READ_TEXT[l.id]=l.text||(l.words||[]).map(w=>w.w).join(' ');return READ_TEXT;}
async function loadStars(){
  const out=[];for(const g of GAMES){let p=null;if(LIVE)p=await json(base(g.app)+'progress.json');if(!p)p=ls(g.app+'.progress.'+kid.id);
    const m=(p&&p[g.key])||{},keys=Object.keys(m).filter(k=>m[k]>0);let items=keys;
    if(g.key==='read'){const t=await readText();items=keys.map(k=>t[k]).filter(Boolean);}
    out.push({...g,stars:+(p&&p.stars)||0,items,n:keys.length});}
  return out;
}
async function loadLight(){
  let recs=[];
  if(LIVE){const names=(await files('maker-light')).filter(n=>/^pic-\d+\.json$/.test(n)).sort().reverse().slice(0,24);for(const n of names){const r=await json(base('maker-light')+n);if(r&&Array.isArray(r.rows))recs.push({id:n,rows:r.rows,t:+r.t||0});}}
  else recs=(ls('kt-light-'+kid.id)||[]).filter(r=>r&&Array.isArray(r.rows)).map(r=>({id:'t'+r.t,rows:r.rows,t:+r.t||0})).reverse();
  return recs;
}
async function loadMaker(){
  if(!LIVE)return [];
  const names=(await files('maker')).filter(n=>/^proj-.*\.json$/.test(n));const out=[];
  for(const n of names){const p=await json(base('maker')+n);if(p&&typeof p==='object')out.push({id:p.id||n,name:p.name||'my make',stage:p.stage||'idea',template:(p.design||{}).template||'',
    ticket:(p.ticket||{}).status||'',msg:(p.ticket||{}).message||'',updated:p.updated||p.created||'',photos:(p.photos||[]).map(x=>x&&x.file).filter(Boolean).map(f=>base('maker')+f)});}
  return out.sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
}
function counts(){return {photos:D.photos.length,show:D.show.length,stars:D.stars.reduce((n,g)=>n+g.stars,0),light:D.light.length,maker:D.maker.length};}
async function load(){
  const my=++seq;D=null;drawTop();$('body').innerHTML='<div class="empty"><div class="big">🎒</div></div>';
  const [photos,show,stars,light,maker]=await Promise.all([loadPhotos(),loadShow(),loadStars(),loadLight(),loadMaker()]);
  if(my!==seq)return;
  D={photos,show,stars,light,maker};
  const c=counts();if(!tab||!c[tab])tab=SECS.find(s=>c[s.id])?.id||'photos';
  drawTop();drawChips();draw();
}
function drawTop(){
  $('av').textContent=AV[kid.avatar]||'🎒';$('who').textContent=kid.name?kid.name+"'s stuff":'My stuff';
  document.body.classList.toggle('pre',+kid.age<5);
  const c=D?counts():null;$('tot').textContent=c&&c.stars?'⭐ '+c.stars:'';
}
function drawChips(){const c=counts();
  $('chips').innerHTML=SECS.map(s=>'<button class="chip'+(s.id===tab?' on':'')+(c[s.id]?'':' zero')+'" data-tab="'+s.id+'"><span class="ic">'+s.ic+'</span>'+E(s.name)+'<span class="n">'+c[s.id]+'</span></button>').join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;kt({kt:'blip',f:620});drawChips();draw();});
}
function empty(s){return '<div class="empty"><div class="big">'+s.ic+'</div><p>'+E(s.hint)+'</p><button class="go" data-open="'+s.app+'">'+s.ic+' Open '+E(s.appName)+'</button></div>';}
function picHTML(p,extra){return '<button class="pic" data-big="'+E(p.id)+'">'+(p.tag?'<span class="tag">'+p.tag+'</span>':'')+'<img src="'+E(p.thumb||p.url)+'" alt="" loading="lazy">'+(extra||'')+'</button>';}
function ledHTML(rows){return '<div class="led">'+rows.map(r=>String(r).padEnd(13,'0').slice(0,13).split('').map(ch=>'<i class="'+(ch==='1'?'on':'')+'"></i>').join('')).join('')+'</div>';}
function draw(){
  const s=SECS.find(x=>x.id===tab),b=$('body');let h='';
  if(tab==='photos')h=D.photos.length?'<div class="grid">'+D.photos.map(p=>picHTML(p)).join('')+'</div>':empty(s);
  else if(tab==='show')h=D.show.length?'<div class="grid">'+D.show.map(x=>'<button class="pic" data-big="s'+E(x.id)+'">'+(x.img?'<img src="'+E(x.img)+'" alt="" loading="lazy">':'<div style="font-size:80px;line-height:150px;text-align:center">🎤</div>')+'<span class="cap">'+E(x.word||'?')+(x.label&&x.label!==x.word?'<span class="sub">'+E(x.label)+'</span>':'')+'</span></button>').join('')+'</div>':empty(s);
  else if(tab==='stars'){const any=D.stars.some(g=>g.stars||g.n);
    h=any?D.stars.map(g=>'<div class="row"><span class="ic">'+g.ic+'</span><div class="l"><b>'+E(g.name)+'</b><small>'+g.n+' '+E(g.unit)+'</small>'+(g.items.length&&g.key!=='songs'?'<div class="words">'+g.items.slice(0,30).map(w=>'<span>'+E(w)+'</span>').join('')+'</div>':'')+'</div><span class="st">'+(g.stars?'⭐ '+g.stars:'')+'</span></div>').join(''):empty(s);}
  else if(tab==='light')h=D.light.length?'<div class="grid">'+D.light.map(r=>'<button class="pic" data-big="l'+E(r.id)+'" style="aspect-ratio:13/8">'+ledHTML(r.rows)+'</button>').join('')+'</div>':empty(s);
  else if(tab==='maker')h=D.maker.length?D.maker.map(p=>{const si=STAGES.indexOf(p.stage);
    return '<div class="proj"><div class="h"><span style="font-size:36px">🔩</span><b>'+E(p.name)+'</b>'+(p.template?'<span class="pill">'+E(p.template)+'</span>':'')+(p.ticket?'<span class="pill '+E(p.ticket)+'">🖨️ '+E(p.ticket)+'</span>':'')+'</div>'
      +'<div class="stages">'+STAGES.map((x,i)=>'<i class="'+(i<=si?'on':'')+'" title="'+x+'"></i>').join('')+'</div>'+(p.msg?'<div class="msg">'+E(p.msg)+'</div>':'')
      +(p.photos.length?'<div class="ph">'+p.photos.map((u,i)=>picHTML({id:'p'+p.id+'-'+i,url:u,thumb:u})).join('')+'</div>':'')+'</div>';}).join(''):empty(s);
  b.innerHTML=h;b.scrollTop=0;
  b.querySelectorAll('[data-big]').forEach(el=>el.onclick=()=>openBig(el.dataset.big));
  b.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{kt({kt:'blip',f:700});kt({kt:'open',id:el.dataset.open});});
}
function openBig(id){
  let inner='',cap='';
  if(id[0]==='s'){const x=D.show.find(y=>'s'+y.id===id);if(!x)return;inner=x.img?'<img src="'+E(x.img)+'" alt="">':'<div style="font-size:120px">🎤</div>';cap=x.word||x.label||'';}
  else if(id[0]==='l'){const r=D.light.find(y=>'l'+y.id===id);if(!r)return;inner=ledHTML(r.rows);}
  else{const p=D.photos.find(y=>y.id===id)||(()=>{for(const pr of D.maker){const i=pr.photos.findIndex((u,i)=>'p'+pr.id+'-'+i===id);if(i>=0)return {url:pr.photos[i]};}})();if(!p)return;inner='<img src="'+E(p.url)+'" alt="">';}
  $('bigIn').innerHTML=inner;$('bigCap').textContent=cap;$('big').classList.add('on');bigOpen=true;kt({kt:'blip',f:880});
}
function closeBig(){$('big').classList.remove('on');$('bigIn').innerHTML='';bigOpen=false;}
$('big').onclick=closeBig;
window.addEventListener('message',e=>{const d=e.data||{};
  if(d.kt==='back'){if(bigOpen){closeBig();kt({kt:'back',handled:true});}return;}
  if(d.kt!=='hello')return;
  const prev=kid.id;
  if(d.kid&&d.kid.id)kid={id:d.kid.id,name:d.kid.name||'',age:+d.kid.age||5,avatar:d.kid.avatar||'frog'};else if(d.child&&d.child.name){kid.name=d.child.name;kid.avatar=d.child.avatar||kid.avatar;}
  if(!D||kid.id!==prev)load();else drawTop();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D)load();});
setTimeout(()=>{if(!D)load();},400);     // opened straight (no launcher): kid "default"
</script></body></html>
