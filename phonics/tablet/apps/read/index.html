<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Read It</title>
<link rel="stylesheet" href="../../design/tiers.css"><script src="../../design/kt.js"></script>
<!-- tablet/apps/read — Read It (PLAN §12 D-030, C5, 2026-10-31): decodable lines from the Word Builder words, three ways:
       Read      the line as word cards. Tap each word in order to read it (any word tapped is spoken — tapping is
                 reading support, never a penalty; only the NEXT word advances). When the line is read the friend reads
                 it back fluently (one Piper sentence clip, cards light along) and asks "Which picture goes with it?"
                 — three picture strips, tap the right one, star.
       Find it   hear a word, tap it in the line; three words a round, star. Second miss pulses the right word.
       Fix it    the words shuffled below empty slots; hear the line, tap the words into order; star.
     Tap-first (D-009). Words are human recordings when one exists (demo/audio/free/words), else a Piper whole-word clip;
     every line has a Piper sentence clip; 👂 sounds the last tapped word out from the vouched-for grapheme tiers (D-010,
     silent where no good clip). Lines live in sentences.json; build.py drops a line whose word has no clip. Levels: 1 =
     up to 4 words, 2 = up to 6, 3 = all, chosen from age + stars like Word Builder. Progress per kid at
     /api/store/read/<kid>/progress.json (hello message, D-008), localStorage on a laptop. Back ◁ while the picture
     question is up returns to the line (handled); otherwise the launcher goes home. window.RD = read-only state for
     tablet/tests/read_dom.py. -->
<style>
:root{--ink:var(--kt-ink,#1d2a3a);--dim:var(--kt-dim,#5b6b80);--card:var(--kt-surface,#fff);--accent:var(--kt-accent,#7e57c2);--ok:var(--kt-ok,#3fb950);--bad:var(--kt-bad,#e05a4f);--tgt:var(--kt-target-min,75px);--gap:var(--kt-target-gap,10px);--t:calc(var(--kt-motion-base,160ms) * var(--motion-scale,1));--warm:#ff8a3d;--r:var(--kt-radius-card,22px);--shadow:0 8px 24px var(--kt-shadow,rgba(40,30,80,.16))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#e8dff8,#fbf8ff);color:var(--ink);font:var(--kt-type-body,20px)/1.3 var(--kt-font-ui,system-ui,sans-serif);touch-action:manipulation}
:root[data-theme=dark] body{background:linear-gradient(160deg,var(--kt-bg-2),var(--kt-bg))}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#bar{display:flex;align-items:center;gap:10px;padding:8px 18px;min-height:72px;flex:none}
#bar h1{font-size:var(--kt-type-label,24px);margin:0 6px 0 0}
.tabs{display:flex;background:rgba(0,0,0,.08);border-radius:30px;padding:4px;gap:2px}
.tabs button{padding:6px 18px;border-radius:999px;font-weight:700;font-size:var(--kt-type-label,17px);white-space:nowrap;min-width:var(--tgt);min-height:var(--tgt);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.tabs .kt-icon{font-size:calc(var(--tgt) * .5)}
.tabs button.on{background:var(--card);box-shadow:var(--shadow)}
#who{margin-left:auto;color:var(--dim);font-size:var(--kt-type-label,16px);font-weight:600}
#stars{font-size:22px;min-width:90px;text-align:right}
.screen{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;gap:18px;padding:6px 30px 16px}
.screen.on{display:flex}
.msg{font-size:var(--kt-type-body,24px);color:var(--dim);min-height:30px;text-align:center}
.row{display:flex;align-items:center;gap:26px}
.pics{font-size:66px;line-height:1;min-height:74px;letter-spacing:6px}
.pics.small{font-size:50px;min-height:56px}
.round{width:max(88px,var(--tgt));height:max(88px,var(--tgt));border-radius:50%;background:var(--accent);color:#fff;font-size:calc(max(88px,var(--tgt)) * .46);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .1s}
.round.alt{background:#26a69a}.round.next{background:var(--warm)}
.round:active,.wd:active,.opt:active{transform:scale(.94)}
.line{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;max-width:1200px;min-height:104px}
.wd{min-width:max(96px,var(--tgt));height:max(96px,var(--tgt));padding:0 22px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:50px;font-weight:800;display:grid;place-items:center;border-bottom:6px solid var(--accent);transition:transform .1s,background .2s;letter-spacing:.02em}
.dot{font-size:50px;font-weight:800;margin-left:-8px}
.wd.read{background:#ede7f6;border-bottom-color:var(--ok)}
.wd.now{box-shadow:0 0 0 5px var(--warm),var(--shadow);transform:scale(1.06)}
.wd.good{background:var(--kt-ok-soft,#dff7e3);animation:pop .35s}
.wd.nope{animation:shake .4s;border-bottom-color:var(--bad)}
.wd.hint{animation:pulse 1s infinite}
.wd.used{visibility:hidden}
.slot{min-width:96px;height:96px;padding:0 22px;border-radius:20px;background:rgba(255,255,255,.5);border:4px dashed rgba(29,42,58,.25);display:grid;place-items:center;font-size:50px;font-weight:800;letter-spacing:.02em}
.slot.full{background:var(--card);border-style:solid;border-color:transparent;box-shadow:var(--shadow);animation:pop .35s}
.slot.next{border-color:var(--warm)}
.ticks{font-size:34px;letter-spacing:6px;color:var(--dim)}
/* picture question */
#rQuiz{display:none;flex-direction:column;align-items:center;gap:14px}
#rQuiz.on{display:flex}
.qTitle{font-size:26px;font-weight:700}
.qOpts{display:flex;gap:26px}
.opt{width:250px;height:170px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:66px;letter-spacing:6px;border-bottom:6px solid var(--accent);transition:transform .1s}
.opt.good{background:var(--kt-ok-soft,#dff7e3);animation:pop .35s}
.opt.nope{animation:shake .4s}
.opt.show{outline:5px solid var(--ok)}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.good,.nope,.new,[class*=good],[class*=nope]{animation:none}}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--warm),var(--shadow)}}
</style></head><body>
<div id="bar"><h1>Read It</h1>
  <div class="tabs" id="tabs"><button data-tab="read" data-say="voice/label_read.mp3" class="on" data-say-text="Read"><span class="kt-icon">📖</span><span class="kt-label">Read</span></button><button data-tab="find" data-say="voice/label_find.mp3" data-say-text="Find it"><span class="kt-icon">🔎</span><span class="kt-label">Find it</span></button><button data-tab="fix" data-say="voice/label_fix.mp3" data-say-text="Fix it"><span class="kt-icon">🧩</span><span class="kt-label">Fix it</span></button></div>
  <div id="who"></div><div id="stars"></div></div>

<div class="screen on" id="read">
  <div class="pics" id="rPics">⭐</div>
  <div class="line" id="rLine"></div>
  <div class="row"><button class="round" id="rPlay" aria-label="read it to me">🔊</button><button class="round alt" id="rSound" aria-label="sound it out">👂</button><button class="round next" id="rNext" aria-label="another line">▶</button></div>
  <div class="msg" id="rMsg"></div>
  <div id="rQuiz"><div class="qTitle">Which picture goes with it?</div><div class="qOpts" id="rOpts"></div></div>
</div>

<div class="screen" id="find">
  <div class="row"><button class="round" id="fPlay" aria-label="hear the word again">🔊</button><div class="ticks" id="fTicks">○ ○ ○</div></div>
  <div class="line" id="fLine"></div>
  <div class="msg" id="fMsg"></div>
</div>

<div class="screen" id="fix">
  <div class="row"><div class="pics small" id="xPics">⭐</div><button class="round" id="xPlay" aria-label="hear the line">🔊</button></div>
  <div class="line" id="xSlots"></div>
  <div class="line" id="xBank"></div>
  <div class="msg" id="xMsg"></div>
</div>

<script>
'use strict';
// The forgiving touch-tap helper lives in design/kt.js since K2 (tier-aware); this fallback covers the page opened from the repo
// on a laptop, where build.py has not copied design/ in.
if(!window.KT)(function(){
let pt=null,lastClick=0;
  document.addEventListener("click",()=>{lastClick=Date.now();},true);
  document.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse")return;
    const b=e.target.closest("button,[role=button],.card,.item,.wd,.tile,.thing,.num,.shape,.opt,.fw");
    if(!b)return;
    pt={b,x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId};
  },true);
  document.addEventListener("pointerup",e=>{
    if(!pt||e.pointerId!==pt.id)return;
    const p=pt;pt=null;
    if(Date.now()-p.t>750||Math.hypot(e.clientX-p.x,e.clientY-p.y)>36)return;
    setTimeout(()=>{if(Date.now()-lastClick>80&&!p.b.disabled)p.b.click();},35);
  },true);
  document.addEventListener("pointercancel",()=>{pt=null;},true);
})();
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIVE=location.protocol.startsWith('http');
const DIGRAPHS=['sh','th','ch','ck','ee','oo','qu'];
let DATA=null,tab='read',kid={id:'default',name:'',age:5},prog={stars:0,read:{},found:0,fixed:{}},seq=0,audio=null,progLoaded=false,lastWord=null;
const kt=m=>{if(m&&m.kt==='blip'&&window.KT)return;try{parent.postMessage(m,'*');}catch(e){}};   // blips are kt.js's job when it is loaded (one click per tap)
const rd={s:null,i:0,quiz:null,busy:false},fd={s:null,t:-1,used:[],got:0,tries:0,busy:false},fx={s:null,next:0,tries:0,busy:false};
const RD={get state(){return {tab,level:level(),stars:prog.stars,kid:kid.id,last:lastWord,
  read:rd.s?{id:rd.s.id,text:rd.s.text,next:rd.i,n:rd.s.words.length,quiz:rd.quiz?rd.quiz.answer:null,busy:rd.busy}:null,
  find:fd.s?{id:fd.s.id,target:fd.t>=0?fd.s.words[fd.t].w:null,got:fd.got,busy:fd.busy}:null,
  fix:fx.s?{id:fx.s.id,next:fx.next,n:fx.s.words.length,expect:fx.s.words[fx.next]?fx.s.words[fx.next].w:null,busy:fx.busy}:null};}};
window.RD=RD;

// ---------- the launcher tells us who is playing (D-008); progress follows the kid
let helloResolve;const hello=new Promise(r=>helloResolve=r);
window.addEventListener('message',e=>{const d=e.data||{};
  if(d.kt==='back'){if(tab==='read'&&rd.quiz){closeQuiz();kt({kt:'back',handled:true});}return;}
  if(d.kt!=='hello')return;
  const prev=kid.id;
  if(d.kid&&d.kid.id)kid={id:d.kid.id,name:d.kid.name||'',age:+d.kid.age||5};else if(d.child&&d.child.name)kid.name=d.child.name;
  helloResolve();
  if(progLoaded&&kid.id!==prev)loadProg();
});
function progKey(){return 'read.progress.'+kid.id;}
async function loadProg(){
  let p=null;
  if(LIVE){try{const r=await fetch('/api/store/read/'+encodeURIComponent(kid.id)+'/progress.json',{cache:'no-store'});if(r.ok)p=await r.json();}catch(e){}}
  if(!p){try{p=JSON.parse(localStorage.getItem(progKey())||'null');}catch(e){}}
  prog=Object.assign({stars:0,read:{},found:0,fixed:{}},p||{});drawStars();
}
async function saveProg(){
  const body=JSON.stringify(prog);
  try{localStorage.setItem(progKey(),body);}catch(e){}
  if(LIVE){try{await fetch('/api/store/read/'+encodeURIComponent(kid.id)+'/progress.json',{method:'PUT',headers:{'Content-Type':'application/json'},body});}catch(e){}}
}
function star(n){prog.stars+=n||1;drawStars();saveProg();kt({kt:'blip',f:720});}
function drawStars(){$('stars').textContent=prog.stars?('⭐'.repeat(Math.min(prog.stars,5))+(prog.stars>5?' '+prog.stars:'')):'';$('who').textContent=kid.name||'';}

// ---------- audio: one player, a new sequence cancels the old one
function stopAudio(){seq++;if(audio){try{audio.pause();}catch(e){}audio=null;}}
function play(src){return new Promise(res=>{if(!src){res(false);return;}const a=new Audio(src);audio=a;a.onended=()=>res(true);a.onerror=()=>res(false);const p=a.play();if(p&&p.catch)p.catch(()=>res(false));});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const V=k=>DATA.voice[k]||null;
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const cap=w=>w==='i'?'I':w[0].toUpperCase()+w.slice(1);
const show=(w,i)=>w==='i'?'I':(i===0?cap(w):w);
function tokens(w){const out=[];for(let i=0;i<w.length;){const d=DIGRAPHS.find(g=>w.startsWith(g,i));if(d){out.push(d);i+=d.length;}else{out.push(w[i]);i++;}}return out;}
// the friend reads the whole line; the cards light along (clip length / words, 380 ms before the length is known)
async function readAlong(s,cards,my){
  const n=cards.length;let per=380;
  const a=new Audio(s.clip);audio=a;
  a.onloadedmetadata=()=>{if(isFinite(a.duration)&&a.duration>0)per=Math.max(220,(a.duration*1000-150)/n);};
  const done=new Promise(res=>{a.onended=()=>res(true);a.onerror=()=>res(false);});
  const p=a.play();if(p&&p.catch)p.catch(()=>{});
  for(let i=0;i<n;i++){if(my!==seq)return false;cards.forEach((c,j)=>c.classList.toggle('now',j===i));await wait(per);}
  cards.forEach(c=>c.classList.remove('now'));
  await Promise.race([done,wait(1200)]);
  return my===seq;
}
async function soundOut(w){const my=++seq;$(tab==='read'?'rMsg':tab==='find'?'fMsg':'xMsg').textContent='Sound it out…';
  for(const g of tokens(w.w)){if(my!==seq)return;await play(DATA.sounds[g]);await wait(90);}
  if(my!==seq)return;await wait(120);await play(w.clip);}

// ---------- which lines: level from age + stars (same rule as Word Builder), the least-read first
function level(){const a=kid.age||5,s=prog.stars;if(a<=4&&s<12)return 1;if(a>=7||s>=24)return 3;return a>=6||s>=8?2:1;}
function pool(){const L=level();let ls=DATA.lines.filter(l=>l.level<=L);if(!ls.length)ls=DATA.lines;return ls;}
function pickLine(counts,avoid){const ls=pool();const min=Math.min(...ls.map(l=>counts[l.id]||0));const c=ls.filter(l=>(counts[l.id]||0)===min&&l.id!==avoid);return pick(c.length?c:ls);}
function drawLine(el,s){el.innerHTML=s.words.map((x,i)=>`<button class="wd" data-i="${i}">${E(show(x.w,i))}</button>`).join('')+'<span class="dot">.</span>';}
function shake(el){el.classList.remove('nope');void el.offsetWidth;el.classList.add('nope');if(window.KT)KT.sound('error',el);else kt({kt:'blip',f:220});}

// ---------- Read
function newRead(){stopAudio();rd.s=pickLine(prog.read,rd.s&&rd.s.id);rd.i=0;rd.quiz=null;rd.busy=false;
  $('rQuiz').classList.remove('on');$('rOpts').innerHTML='';$('rPics').textContent=rd.s.pics;drawLine($('rLine'),rd.s);
  $('rMsg').textContent='Tap each word to read the line';play(V('tap'));}
$('rLine').onclick=async e=>{const b=e.target.closest('.wd');if(!b||rd.busy||rd.quiz)return;
  const i=+b.dataset.i,w=rd.s.words[i];lastWord=w;stopAudio();kt({kt:'blip',f:560});
  if(i===rd.i){b.classList.add('read');rd.i++;const my=seq;await play(w.clip);if(my===seq&&rd.i>=rd.s.words.length)lineDone();}
  else{b.classList.add('now');await play(w.clip);b.classList.remove('now');}};   // any word may be heard; only the next one advances
async function lineDone(){rd.busy=true;const my=++seq;$('rMsg').textContent='Now I will read it…';
  await play(V('readit'));if(my!==seq)return;
  await readAlong(rd.s,[...$('rLine').querySelectorAll('.wd')],my);if(my!==seq)return;
  prog.read[rd.s.id]=(prog.read[rd.s.id]||0)+1;saveProg();
  const others=shuffle(DATA.lines.filter(l=>l.id!==rd.s.id&&l.pics!==rd.s.pics));
  const opts=shuffle([rd.s,...others.filter((l,i,a)=>a.findIndex(x=>x.pics===l.pics)===i).slice(0,2)]);
  $('rOpts').innerHTML=opts.map(l=>`<button class="opt" data-id="${l.id}">${E(l.pics)}</button>`).join('');
  rd.quiz={answer:rd.s.id,tries:0,first:prog.read[rd.s.id]===1};rd.busy=false;
  $('rQuiz').classList.add('on');$('rMsg').textContent='';play(V('which'));}
function closeQuiz(){stopAudio();rd.quiz=null;rd.i=0;$('rQuiz').classList.remove('on');$('rLine').querySelectorAll('.wd').forEach(b=>b.classList.remove('read','now'));$('rMsg').textContent='Tap each word to read the line';}
$('rOpts').onclick=async e=>{const o=e.target.closest('.opt');if(!o||!rd.quiz||rd.busy)return;stopAudio();
  if(o.dataset.id===rd.quiz.answer){rd.busy=true;o.classList.add('good');if(window.KT)KT.sound('success',o);star(1);
    $('rMsg').textContent=['Yes!','You read it!','Great reading'+(kid.name?', '+kid.name:'')+'!','Super!'][prog.stars%4];
    const my=seq;await play(V(rd.quiz.first?'hooray':'yes'));if(my!==seq)return;await wait(900);if(my===seq)newRead();}
  else{shake(o);rd.quiz.tries++;const my=++seq;$('rMsg').textContent='Listen again…';await play(V('again'));if(my!==seq)return;
    if(rd.quiz.tries>=2)$('rOpts').querySelector(`[data-id="${rd.quiz.answer}"]`).classList.add('show');
    await readAlong(rd.s,[...$('rLine').querySelectorAll('.wd')],my);}};
$('rPlay').onclick=()=>{if(!rd.s||rd.busy)return;stopAudio();readAlong(rd.s,[...$('rLine').querySelectorAll('.wd')],++seq);};
$('rSound').onclick=()=>{if(!rd.s||rd.busy)return;stopAudio();soundOut(lastWord||rd.s.words[Math.min(rd.i,rd.s.words.length-1)]);};
$('rNext').onclick=()=>{if(rd.busy)return;newRead();};

// ---------- Find it: three words a round
function newFind(){stopAudio();fd.s=pickLine({},fd.s&&fd.s.id);fd.used=[];fd.got=0;fd.t=-1;fd.busy=false;drawLine($('fLine'),fd.s);drawTicks();nextTarget();}
function drawTicks(){$('fTicks').textContent=[0,1,2].map(i=>i<fd.got?'●':'○').join(' ');}
async function nextTarget(){const free=fd.s.words.map((w,i)=>i).filter(i=>!fd.used.includes(i));fd.t=pick(free);fd.used.push(fd.t);fd.tries=0;fd.busy=false;
  $('fLine').querySelectorAll('.wd').forEach(b=>b.classList.remove('good','hint'));$('fMsg').textContent='Find the word…';
  const my=++seq;await play(V('find'));if(my!==seq)return;await play(fd.s.words[fd.t].clip);}
$('fLine').onclick=async e=>{const b=e.target.closest('.wd');if(!b||fd.busy||fd.t<0)return;const i=+b.dataset.i;const w=fd.s.words[i];lastWord=w;stopAudio();
  if(w.w===fd.s.words[fd.t].w){fd.busy=true;b.classList.add('good');b.classList.remove('hint');fd.got++;drawTicks();kt({kt:'blip',f:720});const my=seq;await play(w.clip);if(my!==seq)return;
    if(fd.got>=3){star(1);if(window.KT)KT.sound('success',$('fLine'));$('fMsg').textContent=['Yes!','You found them all!','Great reading!','Super!'][prog.stars%4];await play(V('great'));if(my!==seq)return;await wait(700);if(my===seq)newFind();}
    else{await wait(350);if(my===seq)nextTarget();}}
  else{shake(b);fd.tries++;const my=++seq;await play(V('again'));if(my!==seq)return;
    if(fd.tries>=2)$('fLine').querySelectorAll('.wd').forEach(x=>{if(fd.s.words[+x.dataset.i].w===fd.s.words[fd.t].w)x.classList.add('hint');});await play(fd.s.words[fd.t].clip);}};
$('fPlay').onclick=()=>{if(!fd.s||fd.t<0)return;stopAudio();++seq;play(fd.s.words[fd.t].clip);};

// ---------- Fix it: the words into order
async function newFix(){stopAudio();fx.s=pickLine(prog.fixed,fx.s&&fx.s.id);fx.next=0;fx.tries=0;fx.busy=true;
  const n=fx.s.words.length;let order=shuffle(fx.s.words.map((w,i)=>i));if(n>1&&order.every((v,i)=>v===i))order=order.slice(1).concat(order[0]);
  $('xPics').textContent=fx.s.pics;
  $('xSlots').innerHTML=fx.s.words.map((w,i)=>`<div class="slot${i===0?' next':''}" data-i="${i}"></div>`).join('')+'<span class="dot">.</span>';
  $('xBank').innerHTML=order.map(i=>`<button class="wd" data-i="${i}">${E(fx.s.words[i].w==='i'?'I':fx.s.words[i].w)}</button>`).join('');
  $('xMsg').textContent='Listen, then put the words in order';fx.busy=false;
  const my=++seq;await play(V('fix'));if(my!==seq)return;await play(fx.s.clip);}
$('xBank').onclick=async e=>{const b=e.target.closest('.wd');if(!b||fx.busy||b.classList.contains('used'))return;const w=fx.s.words[+b.dataset.i];lastWord=w;stopAudio();
  if(w.w===fx.s.words[fx.next].w){b.classList.add('used');$('xBank').querySelectorAll('.wd').forEach(x=>x.classList.remove('hint'));
    const i=fx.next,w=fx.s.words[i];const slot=$('xSlots').querySelector(`.slot[data-i="${i}"]`);slot.textContent=show(w.w,i);slot.classList.add('full');slot.classList.remove('next');
    fx.next++;fx.tries=0;const nx=$('xSlots').querySelector(`.slot[data-i="${fx.next}"]`);if(nx)nx.classList.add('next');
    kt({kt:'blip',f:620});const my=seq;await play(w.clip);if(my!==seq)return;
    if(fx.next>=fx.s.words.length){fx.busy=true;if(window.KT)KT.sound('success',$('xSlots'));prog.fixed[fx.s.id]=(prog.fixed[fx.s.id]||0)+1;star(1);
      $('xMsg').textContent=['You fixed it!','Yes!','Great reading!','Super!'][prog.stars%4];
      await readAlong(fx.s,[...$('xSlots').querySelectorAll('.slot')],my);if(my!==seq)return;await play(V('nice'));if(my!==seq)return;await wait(700);if(my===seq)newFix();}}
  else{shake(b);fx.tries++;const my=++seq;$('xMsg').textContent='Not that one — listen again';await play(V('again'));if(my!==seq)return;
    if(fx.tries>=2){const nx=[...$('xBank').querySelectorAll('.wd')].find(x=>!x.classList.contains('used')&&fx.s.words[+x.dataset.i].w===fx.s.words[fx.next].w);if(nx)nx.classList.add('hint');}await play(fx.s.clip);if(my===seq)$('xMsg').textContent='Which word comes next?';}};
$('xPlay').onclick=()=>{if(!fx.s)return;stopAudio();++seq;play(fx.s.clip);};

// ---------- tabs
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  ['read','find','fix'].forEach(id=>$(id).classList.toggle('on',id===tab));stopAudio();kt({kt:'blip',f:520});
  rd.busy=false;fd.busy=false;fx.busy=false;
  if(tab==='read'&&!rd.s)newRead();if(tab==='find')newFind();if(tab==='fix')newFix();});

  DATA=await (await fetch('data.json')).json();
  await Promise.race([hello,wait(700)]);
  await loadProg();progLoaded=true;
  newRead();
}
