<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stories</title>
<!-- tablet/apps/stories — read-along pages. The friend says the [bracketed] words (real recordings from
     demo/audio/free/words, copied in by build.py); the child taps any of them to hear it again. -->
<style>
:root{--ink:#1d2a3a;--dim:#5b6b80;--card:#fff;--accent:#ff8a3d;--ok:#3fb950;--r:24px;--shadow:0 8px 24px rgba(20,40,80,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#dbeeff,#f4faff);color:var(--ink);font:20px system-ui,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#bar{display:flex;align-items:center;gap:12px;padding:12px 20px;height:76px}
#bar h1{font-size:26px;margin:0;flex:1}
.btn{padding:12px 22px;border-radius:18px;background:#fff;box-shadow:var(--shadow);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px}
.btn.go{background:var(--accent);color:#fff}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.35}
.screen{position:absolute;inset:76px 0 0 0;display:none}
.screen.on{display:block}
#shelf{height:100%;overflow-y:auto;padding:6px 24px 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-content:start;touch-action:pan-y;scrollbar-width:none}
#shelf::-webkit-scrollbar{display:none}
.book{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .1s;min-height:230px;justify-content:center}
.book:active{transform:scale(.95)}
.book .e{font-size:84px;line-height:1}
.book .t{font-size:30px;font-weight:800;text-transform:capitalize}
.book .s{font-size:22px;letter-spacing:4px}
/* reader */
#reader{display:none;flex-direction:column;align-items:stretch;padding:0 24px 18px}
#reader.on{display:flex}
#page{flex:1;background:var(--card);border-radius:34px;box-shadow:var(--shadow);display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:18px 30px 26px;gap:10px}
#art{font-size:150px;line-height:1.1;text-align:center;letter-spacing:10px}
#line{font-size:46px;font-weight:600;text-align:center;line-height:1.5;max-width:1100px}
.w{display:inline-block;padding:2px 14px;margin:0 2px;border-radius:16px;background:#fff1e4;border-bottom:5px solid var(--accent);font-weight:800;transition:transform .12s,background .12s}
.w.now{background:var(--accent);color:#fff;transform:scale(1.12)}
.w:active{transform:scale(.95)}
#nav{display:flex;align-items:center;gap:16px;padding:14px 4px 0}
#dots{flex:1;text-align:center;font-size:20px;letter-spacing:6px;color:var(--dim)}
.arrow{width:78px;height:64px;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-size:30px;font-weight:800;display:grid;place-items:center}
.arrow:active{transform:scale(.95)}
.arrow[disabled]{opacity:.3}
</style></head><body>
<div id="bar"><h1 id="title">Stories</h1><button class="btn" id="back" style="display:none">◀ Books</button></div>
<div id="shelf" class="screen on"></div>
<div id="reader" class="screen">
  <div id="page"><div id="art"></div><div id="line"></div></div>
  <div id="nav"><button class="arrow" id="prev">◀</button><button class="btn go" id="read">▶ Read to me</button><div id="dots"></div><button class="arrow" id="next">▶</button></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let STORIES=[],st=null,pg=0,reading=false,audio=null,child='';
window.addEventListener('message',e=>{const d=e.data||{};if(d.kt==='hello'&&d.child&&d.child.name)child=d.child.name;});
const kt=m=>{try{parent.postMessage(m,'*');}catch(e){}};
function play(word,cb){
  if(audio){try{audio.pause();}catch(e){}}
  audio=new Audio('audio/'+word.toLowerCase()+'.mp3');
  audio.onended=()=>cb&&cb();audio.onerror=()=>cb&&cb();
  const p=audio.play();if(p&&p.catch)p.catch(()=>cb&&cb());
}
async function init(){
  STORIES=(await (await fetch('stories.json')).json()).stories;
  $('shelf').innerHTML=STORIES.map((s,i)=>'<button class="book" data-i="'+i+'"><span class="e">'+E(s.emoji)+'</span><span class="t">'+E(s.title)+'</span><span class="s">'+E(s.scene)+'</span></button>').join('');
  $('shelf').querySelectorAll('.book').forEach(b=>b.onclick=()=>openStory(+b.dataset.i));
}
function openStory(i){
  st=STORIES[i];pg=0;
  $('shelf').classList.remove('on');$('reader').classList.add('on');$('back').style.display='';
  $('title').textContent=st.title[0].toUpperCase()+st.title.slice(1);
  kt({kt:'blip',f:520});
  showPage();
  play(st.title);
}
$('back').onclick=()=>{stopReading();st=null;$('reader').classList.remove('on');$('shelf').classList.add('on');$('back').style.display='none';$('title').textContent='Stories';};
function parse(line){ // "The [frog] [sat] on a [log]." -> tokens
  const out=[];line.split(/(\[[A-Za-z]+\])/).forEach(t=>{const m=t.match(/^\[([A-Za-z]+)\]$/);if(m)out.push({w:m[1]});else if(t)out.push({t});});return out;
}
function showPage(){
  stopReading();
  const p=st.pages[pg];
  $('art').textContent=p.emoji;
  $('line').innerHTML=parse(p.line).map((t,i)=>t.w?'<button class="w" data-w="'+E(t.w)+'" data-i="'+i+'">'+E(t.w)+'</button>':'<span>'+E(t.t)+'</span>').join('');
  $('line').querySelectorAll('.w').forEach(b=>b.onclick=()=>{stopReading();flash(b);play(b.dataset.w);});
  $('dots').textContent=st.pages.map((_,i)=>i===pg?'●':'○').join('');
  $('prev').disabled=pg===0;$('next').disabled=pg===st.pages.length-1;
}
function flash(b){$('line').querySelectorAll('.w.now').forEach(x=>x.classList.remove('now'));b.classList.add('now');setTimeout(()=>b.classList.remove('now'),700);}
$('prev').onclick=()=>{if(pg>0){pg--;showPage();kt({kt:'blip',f:420});}};
$('next').onclick=()=>{if(pg<st.pages.length-1){pg++;showPage();kt({kt:'blip',f:480});}else{kt({kt:'toast',text:'The end! '+(child?'Well read, '+child+'!':'Well read!')});}};
// read to me: the friend says each recorded word in order, highlighting it
function stopReading(){reading=false;$('read').textContent='▶ Read to me';if(audio){try{audio.pause();}catch(e){}}}
$('read').onclick=()=>{
  if(reading){stopReading();return;}
  reading=true;$('read').textContent='■ Stop';
  const words=[...$('line').querySelectorAll('.w')];let i=0;
  (function step(){
    if(!reading)return;
    if(i>=words.length){reading=false;$('read').textContent='▶ Read to me';
      if(pg<st.pages.length-1)setTimeout(()=>{if(!reading){pg++;showPage();}},900);return;}
    const b=words[i++];$('line').querySelectorAll('.w.now').forEach(x=>x.classList.remove('now'));b.classList.add('now');
    play(b.dataset.w,()=>setTimeout(step,420));
  })();
};
init();
</script></body></html>
