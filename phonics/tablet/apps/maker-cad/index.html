<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3D CAD Studio</title>
<style>
  :root{
    --bg:#0d1322; --panel:#162038; --card:#1e2b4a; --ink:#f5f8ff; --muted:#9fb2d8;
    --accent:#ffd54f; --good:#5ce08a; --warn:#ffb74d; --bad:#ff6b6b; --line:#2d3f66;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:700 16px/1.25 system-ui,sans-serif;overflow:hidden}
  body{display:grid;grid-template-rows:50px 58px 1fr}
  /* Pre-reader mode (D-045): hide raw mm/deg/dia numbers, show size icons */
  body.pre .num-only{display:none !important}
  .diy-bar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:#090e1a;border-bottom:2px solid var(--line)}
  .diy-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
  .diy-step{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:800 13px system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
  .diy-step.active{border-color:var(--accent);background:#2c3620;color:var(--accent)}
  .diy-spacer{flex:1}
  .proj-pill{font-size:13px;color:#a5d6ff;background:#132440;border:1px solid #2b4c7e;padding:5px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
  .mode-pill{font-size:12px;color:#ffd54f;background:#2c2510;border:1px solid #665214;padding:4px 10px;border-radius:999px;cursor:pointer}
  header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:2px solid var(--line)}
  header h1{margin:0;font-size:20px}
  .tpl-tabs{display:flex;gap:6px;margin-left:8px}
  .tpl-tab{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 13px system-ui,sans-serif;cursor:pointer}
  .tpl-tab.on{border-color:var(--accent);background:#2a3822;color:var(--accent)}
  .hdr-spacer{flex:1}
  .act-btn{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 13px system-ui,sans-serif;cursor:pointer}
  .act-btn.good{border-color:var(--good);background:#17382b;color:var(--good)}
  main{display:grid;grid-template-columns:1fr 370px;height:100%;overflow:hidden}
  #vpWrap{position:relative;background:radial-gradient(circle at 50% 35%, #1d2c4f, #0b101d);overflow:hidden}
  #vp{width:100%;height:100%;display:block}
  .vp-hud{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
  .hud-badge{background:rgba(13,19,34,.85);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
  .hud-badge b{color:var(--accent)}
  .cam-bar{position:absolute;top:12px;left:12px;display:flex;gap:6px}
  .cam-btn{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(22,32,56,.88);color:var(--ink);font:800 12px system-ui,sans-serif;cursor:pointer}
  aside{background:var(--panel);border-left:2px solid var(--line);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .sec-card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .sec-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
  .slider-row{display:flex;flex-direction:column;gap:4px}
  .slider-lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px}
  .slider-lbl span.val{color:var(--accent);font-weight:900;display:flex;align-items:center;gap:4px}
  .size-ends{display:flex;justify-content:space-between;font-size:15px;padding:0 2px}
  input[type=range]{width:100%;accent-color:var(--accent);height:26px;cursor:pointer}
  .prim-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .prim-btn{padding:10px;border-radius:12px;border:2px solid var(--line);background:#15203a;color:var(--ink);font:800 13px system-ui,sans-serif;cursor:pointer;text-align:center}
  .prim-btn.add{border-color:#4fc3f7}
  .prim-btn.cut{border-color:#ff8a65}
  .prim-list{display:flex;flex-direction:column;gap:6px;max-height:130px;overflow-y:auto}
  .prim-item{display:flex;align-items:center;justify-content:space-between;background:#121b30;padding:6px 10px;border-radius:10px;font-size:13px;border:1px solid var(--line)}
  .prim-item.sel{border-color:var(--accent);background:#26311f}
  .mini-btn{padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:800 11px system-ui,sans-serif;cursor:pointer}
  .scad-modal{position:fixed;inset:0;background:rgba(5,9,18,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .scad-modal.open{display:flex}
  .scad-box{background:var(--panel);border:2px solid var(--accent);border-radius:18px;width:min(760px,95vw);max-height:85vh;display:flex;flex-direction:column;padding:16px;gap:10px}
  .scad-pre{background:#090e1a;color:#a5d6ff;padding:12px;border-radius:12px;font:600 13px/1.4 monospace;overflow:auto;flex:1;margin:0;user-select:text}
</style>
</head>
<body>
  <nav class="diy-bar" id="diyBar" aria-label="DIY Pipeline">
    <span class="diy-lbl">🛠️ DIY Pipeline</span>
    <button class="diy-step" data-app="maker-light">1. 🔌 Sensors</button>
    <button class="diy-step" data-app="maker-code">2. 🧩 Code</button>
    <button class="diy-step active" data-app="maker-cad">3. 📐 3D CAD</button>
    <button class="diy-step" data-app="maker-bench">4. 🧪 Simulate &amp; Print</button>
    <div class="diy-spacer"></div>
    <button class="mode-pill" id="modeBtn" title="Toggle Pre-Reader / Reader Mode">👶 Pre-Reader</button>
    <div class="proj-pill" id="projPill">📦 Project: <b>Kickstand + Latch</b></div>
  </nav>

  <header>
    <h1>📐 3D CAD Studio</h1>
    <div class="tpl-tabs" id="tplTabs">
      <button class="tpl-tab on" data-tpl="kickstand">🦵 Kickstand</button>
      <button class="tpl-tab" data-tpl="hinge">🔩 Hinge Ear</button>
      <button class="tpl-tab" data-tpl="cradle">🧱 Sensor Pod</button>
      <button class="tpl-tab" data-tpl="clip">📎 Edge Clip</button>
    </div>
    <div class="hdr-spacer"></div>
    <button class="act-btn num-only" id="btnScad">📜 OpenSCAD</button>
    <button class="act-btn good" id="btnSim">🧪 Check Fit &amp; Print →</button>
  </header>

  <main>
    <div id="vpWrap">
      <canvas id="vp"></canvas>
      <div class="cam-bar">
        <button class="cam-btn" data-cam="iso">🧊 3D View</button>
        <button class="cam-btn" data-cam="top">⬇️ Top</button>
        <button class="cam-btn" data-cam="side">➡️ Side</button>
        <button class="cam-btn" id="btnGhost">👻 Tablet Grid: ON</button>
      </div>
      <div class="vp-hud">
        <div class="hud-badge">🧩 Snaps to: <b>Tablet Back Grid</b> <span class="num-only">(15 mm M3)</span></div>
        <div class="hud-badge" id="hudSize">📏 Size: <b>🐸 Medium</b> <span class="num-only" id="hudMm">(95×28×6 mm)</span></div>
        <div class="hud-badge" id="hudFit">✅ <b>Ready to Check!</b></div>
      </div>
    </div>

    <aside>
      <div class="sec-card">
        <div class="sec-title"><span>1. Shape Your Part</span><span id="tplLabel">🦵 Kickstand</span></div>
        <div id="paramSliders"></div>
      </div>

      <div class="sec-card">
        <div class="sec-title"><span>2. Fun Stickers &amp; Cutouts</span><span id="primCount">0 added</span></div>
        <div class="prim-grid">
          <button class="prim-btn cut" data-add="star_cut">⭐ Star Window</button>
          <button class="prim-btn cut" data-add="heart_cut">❤️ Heart Window</button>
          <button class="prim-btn cut" data-add="hole">⭕ Peek Hole</button>
          <button class="prim-btn add" data-add="lug">🔩 Extra Grid Lug</button>
        </div>
        <div class="prim-list" id="primList"></div>
        <div id="primNudge" style="display:none;gap:6px;flex-wrap:wrap;justify-content:center;padding-top:4px">
          <button class="mini-btn" data-nudge="-15,0,0">⬅️ Left</button>
          <button class="mini-btn" data-nudge="15,0,0">➡️ Right</button>
          <button class="mini-btn" data-nudge="0,0,-15">⬆️ Up</button>
          <button class="mini-btn" data-nudge="0,0,15">⬇️ Down</button>
          <button class="mini-btn" id="btnDelPrim" style="border-color:var(--bad);color:var(--bad)">🗑️ Remove</button>
        </div>
      </div>

      <div class="sec-card">
        <div class="sec-title"><span>3. Pick Filament Color</span><span id="matTag">PETG / PLA</span></div>
        <div style="display:flex;gap:8px" id="colorRow">
          <button class="mini-btn" data-col="#ff7043" style="background:#ff7043;color:#000;flex:1;padding:10px">🍊 Orange</button>
          <button class="mini-btn" data-col="#42a5f5" style="background:#42a5f5;color:#000;flex:1;padding:10px">🐬 Blue</button>
          <button class="mini-btn" data-col="#66bb6a" style="background:#66bb6a;color:#000;flex:1;padding:10px">🦖 Green</button>
          <button class="mini-btn" data-col="#ffd54f" style="background:#ffd54f;color:#000;flex:1;padding:10px">⭐ Gold</button>
        </div>
      </div>
    </aside>
  </main>

  <div class="scad-modal" id="scadModal">
    <div class="scad-box">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0;font-size:18px">📜 Parametric OpenSCAD Source (15 mm M3 Grid)</h2>
        <button class="act-btn" id="btnCloseScad">✖ Close</button>
      </div>
      <pre class="scad-pre" id="scadCode"></pre>
    </div>
  </div>

<script src="three.min.js"></script>
<script>
(() => {
  'use strict';

  const PROJ_KEY = 'kt.diy.project.v1';
  let preReader = false;

  const TEMPLATES = {
    kickstand: {
      name: '🦵 Kickstand',
      voice: 'Kickstand! Slide the bars to make the leg longer or wider.',
      sliders: [
        { k: 'length', lbl: '🦵 Leg Length', min: 60, max: 135, step: 15, def: 90, unit: 'mm' },
        { k: 'width',  lbl: '📏 Leg Width',  min: 20, max: 45,  step: 5,  def: 30, unit: 'mm' },
        { k: 'thick',  lbl: '🧱 Thickness',  min: 4,  max: 10,  step: 1,  def: 6,  unit: 'mm' },
        { k: 'angle',  lbl: '📐 Open Angle', min: 25, max: 75,  step: 5,  def: 45, unit: '°'  },
        { k: 'lugs',   lbl: '🔩 Grid Bolts', min: 2,  max: 3,   step: 1,  def: 2,  unit: 'x M3' }
      ]
    },
    hinge: {
      name: '🔩 Hinge Ear',
      voice: 'Hinge Ear! Connects a moving part to the back grid.',
      sliders: [
        { k: 'span',      lbl: '📏 Grid Span',   min: 30, max: 60, step: 15, def: 30, unit: 'mm' },
        { k: 'knuckles',  lbl: '🔗 Knuckles',    min: 2,  max: 4,  step: 1,  def: 3,  unit: '' },
        { k: 'clearance', lbl: '💨 Fit Gap',     min: 0.3,max: 0.6,step: 0.1,def: 0.4,unit: 'mm' },
        { k: 'thick',     lbl: '🧱 Base Thick',  min: 4,  max: 8,  step: 1,  def: 5,  unit: 'mm' }
      ]
    },
    cradle: {
      name: '🧱 Sensor Pod',
      voice: 'Sensor Pod! Holds a glowing or knob sensor on the tablet.',
      sliders: [
        { k: 'pocketW', lbl: '📦 Pod Width',  min: 30, max: 60, step: 5, def: 42, unit: 'mm' },
        { k: 'pocketD', lbl: '📦 Pod Depth',  min: 25, max: 50, step: 5, def: 32, unit: 'mm' },
        { k: 'wall',    lbl: '🧱 Wall Strength', min: 3,  max: 6,  step: 1, def: 3,  unit: 'mm' },
        { k: 'lugs',    lbl: '🔩 Grid Tabs',     min: 2,  max: 4,  step: 2, def: 2,  unit: 'x M3' }
      ]
    },
    clip: {
      name: '📎 Edge Clip',
      voice: 'Edge Clip! Hugs the side bumper of the tablet.',
      sliders: [
        { k: 'jaw',   lbl: '👄 Grip Gap',   min: 18, max: 30, step: 2, def: 24, unit: 'mm' },
        { k: 'reach', lbl: '📏 Clip Reach', min: 20, max: 45, step: 5, def: 30, unit: 'mm' },
        { k: 'width', lbl: '📐 Clip Width', min: 15, max: 45, step: 15,def: 30, unit: 'mm' },
        { k: 'thick', lbl: '🧱 Wall Thick', min: 4,  max: 8,  step: 1, def: 5,  unit: 'mm' }
      ]
    }
  };

  function defaultCad() {
    return {
      template: 'kickstand',
      version: 1,
      color: '#ff7043',
      params: { length: 90, width: 30, thick: 6, angle: 45, lugs: 2, span: 30, knuckles: 3, clearance: 0.4, pocketW: 42, pocketD: 32, wall: 3, jaw: 24, reach: 30 },
      primitives: []
    };
  }

  function loadProject() {
    try {
      const p = JSON.parse(localStorage.getItem(PROJ_KEY) || 'null');
      if (p && typeof p === 'object') {
        if (!p.cad) p.cad = defaultCad();
        if (!p.cad.params) p.cad.params = defaultCad().params;
        if (!Array.isArray(p.cad.primitives)) p.cad.primitives = [];
        return p;
      }
    } catch (_) {}
    return { id: 'kickstand-pod', title: 'Kickstand + Latch', cad: defaultCad() };
  }

  let project = loadProject();
  let selectedPrimIdx = -1;
  let showGhost = true;

  function speak(text) {
    try { window.parent.postMessage({ kt: 'tts', text }, '*'); } catch (_) {}
  }

  function applyModeUI() {
    document.body.classList.toggle('pre', preReader);
    const btn = document.getElementById('modeBtn');
    if (btn) btn.textContent = preReader ? '👶 Pre-Reader (Icons)' : '📖 Reader (mm)';
  }

  document.getElementById('modeBtn').addEventListener('click', () => {
    preReader = !preReader;
    applyModeUI();
    renderSliders();
    rebuildMesh();
    speak(preReader ? 'Picture mode on!' : 'Number mode on!');
  });

  window.addEventListener('message', (ev) => {
    const d = ev.data || {};
    if (d.kt === 'hello' && d.kid) {
      if (typeof d.kid.age === 'number') {
        preReader = d.kid.age < 5;
        applyModeUI();
        renderSliders();
        rebuildMesh();
      }
    }
  });
  try { window.parent.postMessage({ kt: 'who' }, '*'); } catch (_) {}

  function syncKitParams() {
    const p = project.cad.params || {};
    p.diy_arm_len = Number(p.length) || 110;
    p.arm_len = p.diy_arm_len;
    p.diy_bar_w = Number(p.width) || 20;
    p.leg_w = p.diy_bar_w;
    const cuts = (project.cad.primitives || []).filter(pr => pr.op === 'cut');
    const lastCut = cuts.length ? cuts[cuts.length - 1].kind : 'none';
    p.diy_cutout = lastCut === 'star_cut' ? 'star' : (lastCut === 'heart_cut' ? 'heart' : (lastCut === 'hole' ? 'ring' : (p.diy_cutout || 'none')));
    p.diy_panel = p.diy_cutout !== 'none' ? 'shield' : (p.diy_panel || 'none');
    p.diy_panel_h = Number(p.diy_panel_h) || 40;
    p.diy_cut_mm = Number(p.diy_cut_mm) || 14;
    p.diy_feet = p.diy_feet !== false;
    project.cad.cutout = p.diy_cutout;
    project.cad.tver = 1;
  }

  function syncDesignToBench() {
    syncKitParams();
    try {
      fetch('/api/maker/design', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          project_id: project.id || 'kickstand-pod',
          template: project.cad.template,
          tver: 1,
          version: 1,
          cutout: project.cad.cutout || 'none',
          params: project.cad.params,
          primitives: project.cad.primitives,
          want: ['preview', 'check']
        })
      }).catch(() => {});
    } catch (_) {}
  }

  function saveProject() {
    project.updated_at = Date.now();
    project.design = project.cad;
    try { localStorage.setItem(PROJ_KEY, JSON.stringify(project)); } catch (_) {}
    try {
      const kid = (window._ktKid && window._ktKid.id) || 'kid2';
      const pid = project.id || 'kickstand-pod';
      fetch('/api/store/maker/' + encodeURIComponent(kid) + '/active.json', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: pid })
      }).catch(() => {});
      fetch('/api/store/maker/' + encodeURIComponent(kid) + '/proj-' + encodeURIComponent(pid) + '.json', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(project)
      }).catch(() => {});
    } catch (_) {}
    document.getElementById('projPill').innerHTML = '📦 Project: <b>' + (project.title || 'My DIY Build') + '</b>';
    syncDesignToBench();
  }

  // Three.js scene setup (60fps preview + offline fallback per D-042)
  const canvas = document.getElementById('vp');
  let renderer = null;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  } catch (_) {
    renderer = { setSize: () => {}, render: () => {} };
  }
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(42, 1, 1, 2000);
  let camSpherical = { r: 230, theta: 0.65, phi: 1.05 };
  function updateCam() {
    camera.position.set(
      camSpherical.r * Math.sin(camSpherical.phi) * Math.sin(camSpherical.theta),
      camSpherical.r * Math.cos(camSpherical.phi),
      camSpherical.r * Math.sin(camSpherical.phi) * Math.cos(camSpherical.theta)
    );
    camera.lookAt(0, 12, 0);
  }
  updateCam();

  scene.add(new THREE.AmbientLight(0xdbe8ff, 0.85));
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.9);
  dir1.position.set(120, 220, 160);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0x88b4ff, 0.4);
  dir2.position.set(-140, -80, -100);
  scene.add(dir2);

  // 15mm M3 reference grid
  const gridGrp = new THREE.Group();
  const gridHelper = new THREE.GridHelper(180, 12, 0xffd54f, 0x2c426e);
  gridGrp.add(gridHelper);
  const bossGeo = new THREE.CylinderGeometry(2.6, 2.6, 1.5, 16);
  const bossMat = new THREE.MeshStandardMaterial({ color: 0x3b5998, metalness: 0.3, roughness: 0.6, transparent: true, opacity: 0.55 });
  for (let x = -45; x <= 45; x += 15) {
    for (let z = -30; z <= 30; z += 15) {
      const m = new THREE.Mesh(bossGeo, bossMat);
      m.position.set(x, 0.75, z);
      gridGrp.add(m);
    }
  }
  scene.add(gridGrp);

  const partGroup = new THREE.Group();
  scene.add(partGroup);

  function sizeTierLabel(val, min, max) {
    const ratio = (val - min) / Math.max(1e-6, (max - min));
    if (ratio < 0.34) return '🐜 Small';
    if (ratio < 0.67) return '🐸 Medium';
    return '🦖 Big';
  }

  function rebuildMesh() {
    while (partGroup.children.length) partGroup.remove(partGroup.children[0]);
    const cad = project.cad;
    const p = cad.params;
    const col = new THREE.Color(cad.color || '#ff7043');
    const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.38, metalness: 0.1 });
    const cutMat = new THREE.MeshStandardMaterial({ color: 0xff5252, roughness: 0.5, wireframe: true });
    const holeDarkMat = new THREE.MeshStandardMaterial({ color: 0x0d1322, roughness: 0.9 });

    function addLug(x, z, thick) {
      const lug = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.5, thick, 24), mat);
      lug.position.set(x, thick / 2, z);
      partGroup.add(lug);
      const hole = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, thick + 0.6, 16), holeDarkMat);
      hole.position.set(x, thick / 2, z);
      partGroup.add(hole);
    }

    let bbox = [90, 30, 6];
    if (cad.template === 'kickstand') {
      syncKitParams();
      lines.push('// Kit render: openscad --backend Manifold -D diy_arm_len=' + p.diy_arm_len + ' -D diy_bar_w=' + p.diy_bar_w + ' -D diy_panel="' + p.diy_panel + '" -D diy_cutout="' + p.diy_cutout + '" projects/tablet-101/diy/kickstand.scad');
      const L = Number(p.length) || 90;
      const W = Number(p.width) || 30;
      const T = Number(p.thick) || 6;
      const lugs = Number(p.lugs) || 2;
      bbox = [L, W, T];
      const mountW = Math.max(W, (lugs - 1) * 15 + 16);
      const mount = new THREE.Mesh(new THREE.BoxGeometry(mountW, T, 22), mat);
      mount.position.set(0, T / 2, -L / 2 + 11);
      partGroup.add(mount);
      for (let i = 0; i < lugs; i++) {
        const lx = (i - (lugs - 1) / 2) * 15;
        addLug(lx, -L / 2 + 11, T + 1);
      }
      const knuck = new THREE.Mesh(new THREE.CylinderGeometry(T * 0.9, T * 0.9, W, 20), mat);
      knuck.rotation.z = Math.PI / 2;
      knuck.position.set(0, T * 0.9, -L / 2 + 22);
      partGroup.add(knuck);
      const legLen = L - 22;
      const leg = new THREE.Mesh(new THREE.BoxGeometry(W, T, legLen), mat);
      const rad = ((Number(p.angle) || 45) * Math.PI) / 180 * 0.35;
      leg.position.set(0, T / 2 + Math.sin(rad) * (legLen / 2), -L / 2 + 22 + Math.cos(rad) * (legLen / 2));
      leg.rotation.x = -rad;
      partGroup.add(leg);
    } else if (cad.template === 'hinge') {
      const span = Number(p.span) || 30;
      const T = Number(p.thick) || 5;
      const K = Number(p.knuckles) || 3;
      bbox = [span + 15, 26, T + 10];
      const base = new THREE.Mesh(new THREE.BoxGeometry(span + 14, T, 24), mat);
      base.position.set(0, T / 2, 0);
      partGroup.add(base);
      addLug(-span / 2, 0, T + 1);
      addLug(span / 2, 0, T + 1);
      for (let i = 0; i < K; i++) {
        const kx = (i - (K - 1) / 2) * (span / Math.max(K, 1));
        const ear = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 7, 20), mat);
        ear.rotation.z = Math.PI / 2;
        ear.position.set(kx, T + 5, 0);
        partGroup.add(ear);
      }
    } else if (cad.template === 'cradle') {
      const W = Number(p.pocketW) || 42;
      const D = Number(p.pocketD) || 32;
      const wall = Number(p.wall) || 3;
      bbox = [W + wall * 2, D + wall * 2, 14];
      const floor = new THREE.Mesh(new THREE.BoxGeometry(W + wall * 2, wall, D + wall * 2), mat);
      floor.position.set(0, wall / 2, 0);
      partGroup.add(floor);
      const wL = new THREE.Mesh(new THREE.BoxGeometry(wall, 12, D + wall * 2), mat);
      wL.position.set(-W / 2 - wall / 2, 6, 0);
      const wR = wL.clone();
      wR.position.x = W / 2 + wall / 2;
      partGroup.add(wL, wR);
      addLug(-15, -D / 2 - 7, wall + 1);
      addLug(15, -D / 2 - 7, wall + 1);
    } else if (cad.template === 'clip') {
      const jaw = Number(p.jaw) || 24;
      const reach = Number(p.reach) || 30;
      const W = Number(p.width) || 30;
      const T = Number(p.thick) || 5;
      bbox = [W, reach + T, jaw + T * 2];
      const spine = new THREE.Mesh(new THREE.BoxGeometry(W, jaw + T * 2, T), mat);
      spine.position.set(0, (jaw + T * 2) / 2, -reach / 2);
      const bot = new THREE.Mesh(new THREE.BoxGeometry(W, T, reach), mat);
      bot.position.set(0, T / 2, 0);
      const top = new THREE.Mesh(new THREE.BoxGeometry(W, T, reach * 0.85), mat);
      top.position.set(0, jaw + T * 1.5, -reach * 0.075);
      partGroup.add(spine, bot, top);
      addLug(0, 0, T + 1);
    }

    (cad.primitives || []).forEach((pr, idx) => {
      let mesh;
      const isCut = pr.op === 'cut';
      const m = isCut ? cutMat : mat;
      if (pr.kind === 'lug') {
        addLug(pr.x || 0, pr.z || 0, 6);
        return;
      } else if (pr.kind === 'hole' || pr.kind === 'star_cut' || pr.kind === 'heart_cut') {
        const sides = pr.kind === 'star_cut' ? 5 : (pr.kind === 'heart_cut' ? 6 : 20);
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(pr.r || 5, pr.r || 5, pr.h || 14, sides), m);
      } else {
        mesh = new THREE.Mesh(new THREE.BoxGeometry(pr.w || 15, pr.h || 8, pr.d || 15), m);
      }
      mesh.position.set(pr.x || 0, (pr.h || 8) / 2, pr.z || 0);
      if (idx === selectedPrimIdx) {
        const box = new THREE.BoxHelper(mesh, 0xffd54f);
        partGroup.add(box);
      }
      partGroup.add(mesh);
    });

    const tier = bbox[0] < 75 ? '🐜 Small' : (bbox[0] < 110 ? '🐸 Medium' : '🦖 Big');
    document.getElementById('hudSize').innerHTML =
      '📏 Size: <b>' + tier + '</b> <span class="num-only" id="hudMm">(' + bbox.join('×') + ' mm)</span>';
    const fitsBed = bbox[0] <= 180 && bbox[1] <= 180;
    document.getElementById('hudFit').innerHTML = fitsBed
      ? '✅ <b>Fits Printer &amp; Tablet Grid!</b>'
      : '⚠️ <b>Too big — make it smaller!</b>';
  }

  let dragging = false, prevX = 0, prevY = 0;
  canvas.addEventListener('pointerdown', (e) => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = (e.clientX - prevX) * 0.01;
    const dy = (e.clientY - prevY) * 0.01;
    prevX = e.clientX; prevY = e.clientY;
    camSpherical.theta -= dx;
    camSpherical.phi = Math.max(0.25, Math.min(1.45, camSpherical.phi - dy));
    updateCam();
  });
  window.addEventListener('pointerup', () => { dragging = false; });

  document.querySelectorAll('[data-cam]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = btn.dataset.cam;
      if (c === 'iso') camSpherical = { r: 230, theta: 0.65, phi: 1.05 };
      if (c === 'top') camSpherical = { r: 240, theta: 0, phi: 0.08 };
      if (c === 'side') camSpherical = { r: 230, theta: 1.57, phi: 1.35 };
      updateCam();
    });
  });

  document.getElementById('btnGhost').addEventListener('click', (e) => {
    showGhost = !showGhost;
    gridGrp.visible = showGhost;
    e.currentTarget.textContent = '👻 Tablet Grid: ' + (showGhost ? 'ON' : 'OFF');
  });

  function renderSliders() {
    const tpl = TEMPLATES[project.cad.template] || TEMPLATES.kickstand;
    document.getElementById('tplLabel').textContent = tpl.name;
    const wrap = document.getElementById('paramSliders');
    wrap.innerHTML = '';
    tpl.sliders.forEach(s => {
      const val = project.cad.params[s.k] !== undefined ? project.cad.params[s.k] : s.def;
      project.cad.params[s.k] = val;
      const row = document.createElement('div');
      row.className = 'slider-row';
      const tier = sizeTierLabel(val, s.min, s.max);
      row.innerHTML =
        '<div class="slider-lbl"><span>' + s.lbl + '</span>' +
        '<span class="val"><span class="tier-txt">' + tier + '</span>' +
        '<span class="num-only">(' + val + ' ' + s.unit + ')</span></span></div>' +
        '<div class="size-ends"><span>🐜</span><span>🐸</span><span>🦖</span></div>' +
        '<input type="range" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + val + '" data-param="' + s.k + '">';
      const inp = row.querySelector('input');
      const tierEl = row.querySelector('.tier-txt');
      const numEl = row.querySelector('.num-only');
      inp.addEventListener('input', () => {
        const v = Number(inp.value);
        project.cad.params[s.k] = v;
        tierEl.textContent = sizeTierLabel(v, s.min, s.max);
        if (numEl) numEl.textContent = '(' + v + ' ' + s.unit + ')';
        saveProject();
        rebuildMesh();
      });
      wrap.appendChild(row);
    });
  }

  function renderPrimList() {
    const list = document.getElementById('primList');
    const prims = project.cad.primitives || [];
    document.getElementById('primCount').textContent = prims.length + ' added';
    list.innerHTML = '';
    prims.forEach((pr, idx) => {
      const item = document.createElement('div');
      item.className = 'prim-item' + (idx === selectedPrimIdx ? ' sel' : '');
      item.innerHTML =
        '<span>' + pr.label + ' <span class="num-only">(' + pr.x + ',' + pr.z + ' mm)</span></span>' +
        '<button class="mini-btn">Select</button>';
      item.addEventListener('click', () => {
        selectedPrimIdx = idx;
        renderPrimList();
        rebuildMesh();
      });
      list.appendChild(item);
    });
    document.getElementById('primNudge').style.display = selectedPrimIdx >= 0 ? 'flex' : 'none';
  }

  document.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.dataset.add;
      const defs = {
        star_cut:  { kind: 'star_cut',  op: 'cut', label: '⭐ Star Window', r: 7, h: 16, x: 0, z: 15 },
        heart_cut: { kind: 'heart_cut', op: 'cut', label: '❤️ Heart Window', r: 7, h: 16, x: 0, z: 0 },
        hole:      { kind: 'hole',      op: 'cut', label: '⭕ Peek Hole',   r: 5, h: 16, x: 0, z: -15 },
        lug:       { kind: 'lug',       op: 'add', label: '🔩 Extra Grid Lug', r: 6.5, h: 6, x: 15, z: -15 }
      };
      project.cad.primitives.push(Object.assign({}, defs[kind]));
      selectedPrimIdx = project.cad.primitives.length - 1;
      saveProject();
      renderPrimList();
      rebuildMesh();
      speak(defs[kind].label + ' added!');
    });
  });

  document.querySelectorAll('[data-nudge]').forEach(btn => {
    btn.addEventListener('click', () => {
      const pr = project.cad.primitives[selectedPrimIdx];
      if (!pr) return;
      const parts = btn.dataset.nudge.split(',').map(Number);
      pr.x = (pr.x || 0) + parts[0];
      pr.z = (pr.z || 0) + parts[2];
      saveProject();
      renderPrimList();
      rebuildMesh();
    });
  });

  document.getElementById('btnDelPrim').addEventListener('click', () => {
    if (selectedPrimIdx < 0) return;
    project.cad.primitives.splice(selectedPrimIdx, 1);
    selectedPrimIdx = -1;
    saveProject();
    renderPrimList();
    rebuildMesh();
  });

  document.querySelectorAll('.tpl-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tpl-tab').forEach(t => t.classList.remove('on'));
      tab.classList.add('on');
      project.cad.template = tab.dataset.tpl;
      saveProject();
      renderSliders();
      rebuildMesh();
      const tpl = TEMPLATES[project.cad.template];
      if (tpl && tpl.voice) speak(tpl.voice);
    });
  });

  document.querySelectorAll('[data-col]').forEach(btn => {
    btn.addEventListener('click', () => {
      project.cad.color = btn.dataset.col;
      saveProject();
      rebuildMesh();
    });
  });

  function generateOpenSCAD() {
    const cad = project.cad;
    const p = cad.params;
    const lines = [
      '// Phonics Friends Kid DIY Part — Generated by 3D CAD Studio',
      '// Project: ' + (project.title || 'My DIY Build') + ' | Template: ' + cad.template,
      '// Standard: 15.0 mm M3 Metric Mounting Grid (3.4 mm through-holes)',
      '$fn = 48;',
      'grid_pitch = 15.0;',
      'm3_Clearance = 3.4;',
      '',
      'module m3_lug(x, z, h) {',
      '  translate([x, z, 0]) difference() {',
      '    cylinder(d=13, h=h);',
      '    translate([0,0,-0.5]) cylinder(d=m3_Clearance, h=h+1);',
      '  }',
      '}',
      ''
    ];
    if (cad.template === 'kickstand') {
      lines.push(
        'length = ' + p.length + '; width = ' + p.width + '; thick = ' + p.thick + '; angle = ' + p.angle + '; lugs = ' + p.lugs + ';',
        'difference() {',
        '  union() {',
        '    translate([-width/2, -length/2, 0]) cube([width, length, thick]);',
        '    for (i = [0 : lugs-1]) m3_lug((i - (lugs-1)/2)*grid_pitch, -length/2 + 11, thick);',
        '  }',
        '  for (i = [0 : lugs-1]) translate([(i - (lugs-1)/2)*grid_pitch, -length/2 + 11, -1]) cylinder(d=m3_Clearance, h=thick+2);',
        '}'
      );
    } else {
      lines.push('// Parametric ' + cad.template + ' body', 'cube([' + (p.span || 40) + ', 26, ' + (p.thick || 5) + '], center=true);');
    }
    return lines.join('\n');
  }

  document.getElementById('btnScad').addEventListener('click', () => {
    document.getElementById('scadCode').textContent = generateOpenSCAD();
    document.getElementById('scadModal').classList.add('open');
  });
  document.getElementById('btnCloseScad').addEventListener('click', () => {
    document.getElementById('scadModal').classList.remove('open');
  });

  function openMakerApp(appId) {
    saveProject();
    try {
      window.parent.postMessage({ kt: 'open', id: appId, project: project.id }, '*');
    } catch (_) {}
  }

  document.getElementById('btnSim').addEventListener('click', () => openMakerApp('maker-bench'));
  document.querySelectorAll('#diyBar .diy-step').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.app;
      if (target && target !== 'maker-cad') openMakerApp(target);
    });
  });

  function resize() {
    const wrap = document.getElementById('vpWrap');
    const w = wrap.clientWidth || 640;
    const h = wrap.clientHeight || 420;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  document.querySelectorAll('.tpl-tab').forEach(t => {
    t.classList.toggle('on', t.dataset.tpl === project.cad.template);
  });
  applyModeUI();
  saveProject();
  renderSliders();
  renderPrimList();
  resize();
  rebuildMesh();

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
