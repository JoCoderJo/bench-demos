<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Count With Me</title>
<!-- tablet/apps/count — Count With Me, three ways to play with numbers (S3b, 2026-10-25):
       Count    a handful of frogs (ducks, apples …) scatter on the field; tap each one and the friend says the next
                number, then tap how many from three number cards. A wrong card = the friend counts them together,
                one highlight per thing; after two misses the right card glows.
       Shapes   "Find the circle" / "Find the red one" / "Find the red square" — four big shape cards (inline SVG),
                tap the one asked for. Level decides whether shape, colour or both is the cue.
       Add      two groups ("three, and two more — how many altogether?"), count across both by tapping, pick the sum.
                Only for the older kid (level 2+): sums to 5, then to 10.
     Tap-first (D-009): no mic, no drag. Numbers and prompts are Piper whole words/sentences made once by make-voice.py;
     a number with a human recording (ten) is used instead by build.py (D-010). Level comes from kid.age + stars.
     Progress is per kid: /api/store/count/<kid>/progress.json via the launcher's hello message (D-008), localStorage
     when opened on a laptop. window.CM exposes read-only state for tablet/tests/count_dom.py. -->
<style>
:root{--ink:#1d2a3a;--dim:#5b6b80;--card:#fff;--accent:#ff8a3d;--ok:#3fb950;--bad:#e05a4f;--indigo:#5c6bc0;--r:22px;--shadow:0 8px 24px rgba(20,40,80,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#dfe3ff,#f6f7ff);color:var(--ink);font:20px system-ui,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#bar{display:flex;align-items:center;gap:10px;padding:10px 18px;height:72px}
#bar h1{font-size:24px;margin:0 6px 0 0}
.tabs{display:flex;background:rgba(0,0,0,.08);border-radius:30px;padding:4px;gap:2px}
.tabs button{padding:9px 18px;border-radius:26px;font-weight:700;font-size:17px;white-space:nowrap}
.tabs button.on{background:var(--card);box-shadow:var(--shadow)}
.tabs button.hide{display:none}
#who{margin-left:auto;color:var(--dim);font-size:16px;font-weight:600}
#stars{font-size:22px;min-width:90px;text-align:right}
.screen{position:absolute;inset:72px 0 0 0;display:none;flex-direction:column;align-items:center;gap:14px;padding:4px 30px 16px}
.screen.on{display:flex}
.msg{font-size:24px;color:var(--dim);min-height:30px;text-align:center}
.top{display:flex;align-items:center;gap:22px;min-height:80px}
.ask{font-size:30px;font-weight:800}
.round{width:80px;height:80px;border-radius:50%;background:var(--accent);color:#fff;font-size:38px;display:grid;place-items:center;box-shadow:var(--shadow)}
.round.alt{background:var(--indigo)}
.round:active,.thing:active,.num:active,.shape:active{transform:scale(.94)}
/* the field of things to count */
.field{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px 14px;width:1120px;max-width:100%;min-height:230px;padding:10px;border-radius:28px;background:rgba(255,255,255,.45)}
.thing{position:relative;width:92px;height:92px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);font-size:60px;line-height:1;display:grid;place-items:center;transition:transform .12s}
.thing.cnt{background:#eef0ff;box-shadow:0 0 0 4px var(--indigo),var(--shadow)}
.thing.now{box-shadow:0 0 0 5px var(--accent),var(--shadow);transform:scale(1.08)}
.thing .b{position:absolute;top:-10px;right:-10px;min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:var(--indigo);color:#fff;font-size:20px;font-weight:800;display:none;place-items:center;line-height:34px;text-align:center}
.thing.cnt .b{display:grid}
.groups{display:flex;align-items:center;gap:18px;width:1120px;max-width:100%}
.groups .field{width:auto;flex:1;min-height:210px}
.plus{font-size:64px;font-weight:800;color:var(--indigo)}
/* number cards */
.nums{display:flex;gap:26px;min-height:120px}
.num{width:150px;height:116px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);font-size:64px;font-weight:800;border-bottom:6px solid var(--indigo);display:grid;place-items:center;transition:transform .1s}
.num.good{background:#dff7e3;animation:pop .35s}
.num.nope{animation:shake .4s;border-bottom-color:var(--bad)}
.num.show{outline:5px solid var(--ok)}
/* shape cards */
#sCards{display:flex;gap:26px;min-height:300px;align-items:center}
.shape{width:230px;height:250px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .1s}
.shape svg{width:170px;height:170px}
.shape.good{background:#dff7e3;animation:pop .35s}
.shape.nope{animation:shake .4s}
.shape.show{outline:5px solid var(--ok)}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
</style></head><body>
<div id="bar"><h1>Count</h1>
  <div class="tabs" id="tabs"><button data-tab="count" class="on">Count</button><button data-tab="shapes">Shapes</button><button data-tab="add" class="hide">Add</button></div>
  <div id="who"></div><div id="stars"></div></div>

<div class="screen on" id="count">
  <div class="top"><button class="round" id="cPlay" aria-label="hear the question">🔊</button><div class="ask">How many do you see?</div><button class="round alt" id="cHelp" aria-label="count together">👂</button></div>
  <div class="field" id="field"></div>
  <div class="nums" id="nums"></div>
  <div class="msg" id="cMsg"></div>
</div>

<div class="screen" id="shapes">
  <div class="top"><button class="round" id="sPlay" aria-label="hear it again">🔊</button><div class="ask" id="sAsk">Find the circle</div></div>
  <div id="sCards"></div>
  <div class="msg" id="sMsg"></div>
</div>

<div class="screen" id="add">
  <div class="top"><button class="round" id="aPlay" aria-label="hear the question">🔊</button><div class="ask" id="aAsk"></div><button class="round alt" id="aHelp" aria-label="count together">👂</button></div>
  <div class="groups"><div class="field" id="gA"></div><div class="plus">+</div><div class="field" id="gB"></div></div>
  <div class="nums" id="sums"></div>
  <div class="msg" id="aMsg"></div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIVE=location.protocol.startsWith('http');
const WORDS=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const THINGS=['🐸','🦆','🍎','⭐','🐟','🐞','🎈','🍓','🐢','🌼'];
const SHAPES=['circle','square','triangle','star','heart','rectangle'];
const COLORS={red:'#e53935',blue:'#1e88e5',green:'#43a047',yellow:'#fdd835',orange:'#fb8c00',purple:'#8e24aa'};
const SVG={circle:'<circle cx="50" cy="50" r="42"/>',square:'<rect x="9" y="9" width="82" height="82" rx="8"/>',rectangle:'<rect x="4" y="26" width="92" height="48" rx="7"/>',
  triangle:'<polygon points="50,7 95,91 5,91"/>',star:'<polygon points="50,5 61,38 96,38 68,59 79,93 50,72 21,93 32,59 4,38 39,38"/>',
  heart:'<path d="M50 90 L14 54 A20 20 0 0 1 50 26 A20 20 0 0 1 86 54 Z"/>'};
let DATA=null,tab='count',kid={id:'default',name:'',age:5},prog={stars:0,counted:{},shapes:{},sums:{}},seq=0,audio=null,progLoaded=false;
const kt=m=>{try{parent.postMessage(m,'*');}catch(e){}};
const CM={get state(){return {tab,level:level(),n:cnt.n,counted:cnt.marked.length,answer:shp.ans?{s:shp.ans.s,c:shp.ans.c,cue:shp.cue}:null,sum:add.a?add.a+add.b:null,a:add.a,b:add.b,stars:prog.stars,kid:kid.id};}};
window.CM=CM;

// ---------- the launcher tells us who is playing (D-008); progress follows the kid
let helloResolve;const hello=new Promise(r=>helloResolve=r);
window.addEventListener('message',e=>{const d=e.data||{};if(d.kt!=='hello')return;
  const prev=kid.id;
  if(d.kid&&d.kid.id)kid={id:d.kid.id,name:d.kid.name||'',age:+d.kid.age||5};else if(d.child&&d.child.name)kid.name=d.child.name;
  helloResolve();
  if(progLoaded&&kid.id!==prev)loadProg();
  drawTabs();
});
function progKey(){return 'count.progress.'+kid.id;}
async function loadProg(){
  let p=null;
  if(LIVE){try{const r=await fetch('/api/store/count/'+encodeURIComponent(kid.id)+'/progress.json',{cache:'no-store'});if(r.ok)p=await r.json();}catch(e){}}
  if(!p){try{p=JSON.parse(localStorage.getItem(progKey())||'null');}catch(e){}}
  if(p&&typeof p==='object')prog={stars:+p.stars||0,counted:p.counted||{},shapes:p.shapes||{},sums:p.sums||{}};
  drawStars();
}
let saveT=null;
function saveProg(){clearTimeout(saveT);saveT=setTimeout(async()=>{
  const body=JSON.stringify(prog);
  try{localStorage.setItem(progKey(),body);}catch(e){}
  if(LIVE){try{await fetch('/api/store/count/'+encodeURIComponent(kid.id)+'/progress.json',{method:'PUT',headers:{'Content-Type':'application/json'},body});}catch(e){}}
},400);}
function star(n){prog.stars+=n||1;drawStars();saveProg();kt({kt:'blip',f:720});}
function drawStars(){$('stars').textContent=prog.stars?('⭐'.repeat(Math.min(prog.stars,5))+(prog.stars>5?' '+prog.stars:'')):'';$('who').textContent=kid.name||'';drawTabs();}
function drawTabs(){$('tabs').querySelector('[data-tab="add"]').classList.toggle('hide',level()<2);}

// ---------- audio: one player, a new sequence cancels the old one
function stopAudio(){seq++;if(audio){try{audio.pause();}catch(e){}audio=null;}}
function play(src){return new Promise(res=>{if(!src){res(false);return;}const a=new Audio(src);audio=a;a.onended=()=>res(true);a.onerror=()=>res(false);const p=a.play();if(p&&p.catch)p.catch(()=>res(false));});}
async function playList(list,gap,onEach){const my=++seq;for(let i=0;i<list.length;i++){if(my!==seq)return false;if(onEach)onEach(i);await play(list[i]);if(my!==seq)return false;if(gap&&i<list.length-1)await wait(gap);}if(onEach&&my===seq)onEach(-1);return my===seq;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const V=k=>(DATA&&DATA.voice[k])||null;
const N=n=>V('n'+n);
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function level(){const a=kid.age||5,s=prog.stars;if(a<=4&&s<15)return 1;if(a>=7||s>=30)return 3;return 2;}
function cheer(){return ['Yes!','You got it!','Great counting'+(kid.name?', '+kid.name:'')+'!','Super!'][prog.stars%4];}
function choices(ans,max){
  // three number cards: the answer and two neighbours inside 1..max
  const set=new Set([ans]);
  const near=shuffle([ans-1,ans+1,ans-2,ans+2,ans+3,ans-3]).filter(x=>x>=1&&x<=Math.max(max,3));
  for(const x of near){if(set.size>=3)break;set.add(x);}
  let k=1;while(set.size<3){if(!set.has(k))set.add(k);k++;}
  return shuffle([...set]);
}
function thingHTML(e,i,g){return '<button class="thing" data-i="'+i+'"'+(g!=null?' data-g="'+g+'"':'')+' style="transform:rotate('+rnd(-9,9)+'deg)"><span>'+e+'</span><span class="b"></span></button>';}

// ---------- COUNT: tap each thing (the friend says the number), then tap how many
const cnt={n:0,marked:[],misses:0,busy:false,emoji:'🐸'};
function maxCount(){return [5,10,20][level()-1];}
function newCount(){
  stopAudio();
  const max=maxCount();let n=rnd(1,max);if(n===cnt.n)n=n===max?Math.max(1,n-1):n+1;
  cnt.n=n;cnt.marked=[];cnt.misses=0;cnt.busy=false;cnt.emoji=pick(THINGS);
  $('cMsg').textContent='';
  $('field').innerHTML=Array.from({length:n},(_,i)=>thingHTML(cnt.emoji,i)).join('');
  $('field').querySelectorAll('.thing').forEach(t=>t.onclick=()=>tapThing(t,cnt,$('field')));
  $('nums').innerHTML=choices(n,max).map(x=>'<button class="num" data-n="'+x+'">'+x+'</button>').join('');
  $('nums').querySelectorAll('.num').forEach(b=>b.onclick=()=>answerCount(b));
  playList([V('howmany')].filter(Boolean),0);
}
function tapThing(t,st,field){
  // counting by hand: the k-th new tap gets badge k and says "k"; a counted thing says its number again
  if(st.busy)return;stopAudio();
  const i=t.dataset.i+(t.dataset.g||'');
  let k=st.marked.indexOf(i)+1;
  if(!k){st.marked.push(i);k=st.marked.length;t.classList.add('cnt');t.querySelector('.b').textContent=k;}
  kt({kt:'blip',f:440+k*30});
  play(N(k));
}
async function countTogether(st,things,total,after){
  // the friend counts: highlight + number clip, one thing at a time, then the total
  st.busy=true;stopAudio();st.marked=[];
  things.forEach(t=>{t.classList.remove('cnt','now');t.querySelector('.b').textContent='';});
  const ok=await playList(things.map((_,k)=>N(k+1)),120,k=>{things.forEach(t=>t.classList.remove('now'));if(k>=0){const t=things[k];t.classList.add('now','cnt');t.querySelector('.b').textContent=k+1;st.marked.push(t.dataset.i+(t.dataset.g||''));}});
  if(ok&&after)await after();
  st.busy=false;
}
async function answerCount(b){
  if(cnt.busy)return;
  const n=cnt.n,got=+b.dataset.n;
  stopAudio();
  if(got===n){
    cnt.busy=true;b.classList.add('good');
    prog.counted[n]=(prog.counted[n]||0)+1;star(1);$('cMsg').textContent=cheer()+' '+WORDS[n][0].toUpperCase()+WORDS[n].slice(1)+' '+(n===1?'':'')+'!';
    await playList([V('yes'),N(n)].filter(Boolean),150);
    await wait(900);
    if(cnt.n!==n||tab!=='count'){cnt.busy=false;return;}
    newCount();return;
  }
  cnt.misses++;
  b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');kt({kt:'blip',f:220});
  $('cMsg').textContent=cnt.misses>=2?'It is this one':'Let’s count them together…';
  if(cnt.misses>=2){const r=$('nums').querySelector('.num[data-n="'+n+'"]');if(r)r.classList.add('show');}
  await play(V('together'));
  if(cnt.n!==n)return;
  await countTogether(cnt,[...$('field').querySelectorAll('.thing')],n,async()=>{await wait(150);await play(N(n));});
}
$('cPlay').onclick=()=>{if(cnt.busy)return;stopAudio();play(V('howmany'));};
$('cHelp').onclick=()=>{if(cnt.busy)return;const n=cnt.n;countTogether(cnt,[...$('field').querySelectorAll('.thing')],n,async()=>{await wait(150);await play(N(n));});};

// ---------- SHAPES: find the one asked for
const shp={ans:null,cue:'shape',cards:[],tries:0,busy:false,last:''};
function newShape(){
  stopAudio();shp.tries=0;shp.busy=false;$('sMsg').textContent='';
  const L=level(),colors=Object.keys(COLORS);
  let cue=L===1?'shape':L===2?pick(['shape','color']):pick(['shape','color','both','both']);
  if(cue===shp.last&&L>1)cue=cue==='shape'?'color':'shape';shp.last=cue;shp.cue=cue;
  let cards;
  if(cue==='shape'){const c=pick(colors);cards=shuffle(SHAPES).slice(0,4).map(s=>({s,c}));}
  else if(cue==='color'){const s=pick(SHAPES);cards=shuffle(colors).slice(0,4).map(c=>({s,c}));}
  else{const s=pick(SHAPES),c=pick(colors),os=shuffle(SHAPES.filter(x=>x!==s)),oc=shuffle(colors.filter(x=>x!==c));
    cards=shuffle([{s,c},{s,c:oc[0]},{s:os[0],c},{s:os[1],c:oc[1]}]);}
  // 'both': the answer is the one card that shares its shape with one neighbour and its colour with another
  shp.ans=cue!=='both'?pick(cards):cards.find(k=>cards.filter(x=>x.s===k.s).length===2&&cards.filter(x=>x.c===k.c).length===2);
  const a=shp.ans,text=cue==='shape'?'Find the '+a.s:cue==='color'?'Find the '+a.c+' one':'Find the '+a.c+' '+a.s;
  $('sAsk').textContent=text;
  $('sCards').innerHTML=cards.map((k,i)=>'<button class="shape" data-s="'+k.s+'" data-c="'+k.c+'" data-i="'+i+'"><svg viewBox="0 0 100 100" fill="'+COLORS[k.c]+'">'+SVG[k.s]+'</svg></button>').join('');
  $('sCards').querySelectorAll('.shape').forEach(b=>b.onclick=()=>answerShape(b));
  shp.cards=cards;
  playList([shapePrompt()].filter(Boolean),0);
}
function shapePrompt(){const a=shp.ans;return shp.cue==='shape'?V('shape_'+a.s):shp.cue==='color'?V('color_'+a.c):V('cs_'+a.c+'_'+a.s);}
function isAns(b){const a=shp.ans;return shp.cue==='shape'?b.dataset.s===a.s:shp.cue==='color'?b.dataset.c===a.c:(b.dataset.s===a.s&&b.dataset.c===a.c);}
async function answerShape(b){
  if(shp.busy||!shp.ans||b.classList.contains('nope'))return;
  const a=shp.ans;stopAudio();
  if(isAns(b)){
    shp.busy=true;b.classList.add('good');
    const key=shp.cue==='color'?a.c:a.s;prog.shapes[key]=(prog.shapes[key]||0)+1;star(1);
    $('sMsg').textContent=cheer();
    await playList([V('yes'),shp.cue==='color'?V('isc_'+a.c):V('is_'+a.s)].filter(Boolean),150);
    await wait(800);
    if(shp.ans!==a||tab!=='shapes'){shp.busy=false;return;}
    newShape();return;
  }
  shp.tries++;b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');kt({kt:'blip',f:220});
  $('sMsg').textContent=shp.tries>=2?'It is this one':'Try again…';
  if(shp.tries>=2){const r=[...$('sCards').querySelectorAll('.shape')].find(isAns);if(r)r.classList.add('show');}
  await playList([V('again'),shapePrompt()].filter(Boolean),200);
}
$('sPlay').onclick=()=>{if(shp.ans){stopAudio();play(shapePrompt());}};

// ---------- ADD: two groups, count across both, pick the sum (level 2+)
const add={a:0,b:0,marked:[],misses:0,busy:false,emoji:'🐸'};
function maxSum(){return level()>=3?10:5;}
function newAdd(){
  stopAudio();
  const max=maxSum();let a=rnd(1,max-1),b=rnd(1,max-a);
  if(a===add.a&&b===add.b){b=b>1?b-1:Math.min(b+1,max-a);}
  add.a=a;add.b=b;add.marked=[];add.misses=0;add.busy=false;add.emoji=pick(THINGS);
  $('aMsg').textContent='';$('aAsk').textContent=a+' and '+b+' more';
  $('gA').innerHTML=Array.from({length:a},(_,i)=>thingHTML(add.emoji,i,'a')).join('');
  $('gB').innerHTML=Array.from({length:b},(_,i)=>thingHTML(add.emoji,i,'b')).join('');
  addThings().forEach(t=>t.onclick=()=>tapThing(t,add));
  $('sums').innerHTML=choices(a+b,max).map(x=>'<button class="num" data-n="'+x+'">'+x+'</button>').join('');
  $('sums').querySelectorAll('.num').forEach(x=>x.onclick=()=>answerAdd(x));
  playList(addPrompt(),140);
}
function addThings(){return [...$('gA').querySelectorAll('.thing'),...$('gB').querySelectorAll('.thing')];}
function addPrompt(){return [N(add.a),V('and'),N(add.b),V('more'),V('altogether')].filter(Boolean);}
async function answerAdd(b){
  if(add.busy)return;
  const a=add.a,bb=add.b,n=a+bb,got=+b.dataset.n;
  stopAudio();
  if(got===n){
    add.busy=true;b.classList.add('good');
    prog.sums[a+'+'+bb]=(prog.sums[a+'+'+bb]||0)+1;star(1);$('aMsg').textContent=cheer()+' '+a+' and '+bb+' makes '+n+'!';
    await playList([V('yes'),N(a),V('and'),N(bb),V('makes'),N(n)].filter(Boolean),120);
    await wait(900);
    if(add.a!==a||add.b!==bb||tab!=='add'){add.busy=false;return;}
    newAdd();return;
  }
  add.misses++;
  b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');kt({kt:'blip',f:220});
  $('aMsg').textContent=add.misses>=2?'It is this one':'Let’s count them together…';
  if(add.misses>=2){const r=$('sums').querySelector('.num[data-n="'+n+'"]');if(r)r.classList.add('show');}
  await play(V('together'));
  if(add.a!==a||add.b!==bb)return;
  await countTogether(add,addThings(),n,async()=>{await wait(150);await play(N(n));});
}
$('aPlay').onclick=()=>{if(add.busy)return;stopAudio();playList(addPrompt(),140);};
$('aHelp').onclick=()=>{if(add.busy)return;const n=add.a+add.b;countTogether(add,addThings(),n,async()=>{await wait(150);await play(N(n));});};

// ---------- tabs
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  ['count','shapes','add'].forEach(id=>$(id).classList.toggle('on',id===tab));stopAudio();kt({kt:'blip',f:520});
  if(tab==='count'&&(!cnt.n||cnt.busy))newCount();if(tab==='shapes')newShape();if(tab==='add')newAdd();});

async function init(){
  DATA=await (await fetch('data.json')).json();
  await Promise.race([hello,wait(700)]);   // the launcher's hello names the kid; alone on a laptop we are "default"
