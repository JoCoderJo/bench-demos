<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Music Pads</title>
<!-- tablet/apps/music — Music Pads (S3c, 2026-10-25): three ways to make music with the same eight bars and four drums.
       Play     a rainbow xylophone (C major, C4–C5) and four drum pads — tap and hear, nothing to get wrong.
       Songs    follow the lights: the friend plays a few notes of a song (bars light up), then "your turn" — tap them back.
                Chunk size grows with level (2 notes / 4 notes / a whole line). A wrong bar hums, two misses light the right one.
                A finished song replays itself with lights.
       Beat     Simon with drums: listen to a short pattern, play it back; it grows by one each round.
     Every sound is WebAudio synthesis on the tablet (sine + 3rd harmonic with a fast decay for the xylophone; sine sweep,
     filtered noise bursts for the drums) — no samples, nothing from the network. The friend's lines are Piper sentences
     made once by make-voice.py (D-010). Tap-first (D-009). Progress per kid: /api/store/music/<kid>/progress.json via the
     launcher's hello message (D-008), localStorage on a laptop. window.MP exposes read-only state for tests/music_dom.py. -->
<style>
:root{--ink:#1d2a3a;--dim:#5b6b80;--card:#fff;--accent:#ff8a3d;--ok:#3fb950;--bad:#e05a4f;--purple:#ab47bc;--r:22px;--shadow:0 8px 24px rgba(20,40,80,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#f3e5f5,#fdf7ff);color:var(--ink);font:20px system-ui,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#bar{display:flex;align-items:center;gap:10px;padding:10px 18px;height:72px}
#bar h1{font-size:24px;margin:0 6px 0 0}
.tabs{display:flex;background:rgba(0,0,0,.08);border-radius:30px;padding:4px;gap:2px}
.tabs button{padding:9px 18px;border-radius:26px;font-weight:700;font-size:17px;white-space:nowrap}
.tabs button.on{background:var(--card);box-shadow:var(--shadow)}
#who{margin-left:auto;color:var(--dim);font-size:16px;font-weight:600}
#stars{font-size:22px;min-width:90px;text-align:right}
.screen{position:absolute;inset:72px 0 0 0;display:none;flex-direction:column;align-items:center;gap:14px;padding:4px 30px 16px}
.screen.on{display:flex}
.msg{font-size:24px;color:var(--dim);min-height:30px;text-align:center}
.top{display:flex;align-items:center;gap:18px;min-height:70px}
.round{width:76px;height:76px;border-radius:50%;background:var(--accent);color:#fff;font-size:36px;display:grid;place-items:center;box-shadow:var(--shadow)}
.round:active,.key:active,.pad:active,.chip:active{transform:scale(.96)}
/* xylophone: eight bars, tall to short like the real thing */
.xylo{display:flex;align-items:flex-end;gap:12px;height:300px}
.key{width:118px;border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:12px;color:#fff;font-size:30px;font-weight:800;position:relative;transition:transform .08s,filter .08s;text-shadow:0 2px 4px rgba(0,0,0,.25)}
.key::before,.key::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.75);left:50%;transform:translateX(-50%)}
.key::before{top:14px}.key::after{bottom:46px}
.key.lit{filter:brightness(1.35) saturate(1.2);transform:translateY(-10px) scale(1.04);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 14px 30px rgba(0,0,0,.25)}
.key.hint{animation:pulse .7s ease-in-out infinite}
.key.nope{animation:shake .4s}
.xylo.small{height:210px}.xylo.small .key{width:104px;font-size:24px}
/* drums */
.drums{display:flex;gap:22px}
.pad{width:200px;height:130px;border-radius:26px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:22px;font-weight:800;border-bottom:8px solid var(--purple);transition:transform .08s,filter .08s}
.pad span{font-size:44px}
.pad.lit{filter:brightness(1.1);transform:scale(1.06);box-shadow:0 0 0 6px var(--accent),var(--shadow)}
.pad.hint{animation:pulse .7s ease-in-out infinite}
.pad.nope{animation:shake .4s}
.drums.big .pad{width:250px;height:190px;font-size:26px}.drums.big .pad span{font-size:64px}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--accent),var(--shadow)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
/* songs */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:1150px}
.chip{padding:10px 18px;border-radius:24px;background:rgba(255,255,255,.75);font-weight:800;font-size:19px;box-shadow:var(--shadow)}
.chip.on{background:var(--purple);color:#fff}
.chip.done::after{content:" ⭐"}
.dots{display:flex;gap:8px;min-height:16px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.12)}
.dots i.done{background:var(--ok)}.dots i.now{background:var(--accent)}
#beatRound{font-size:22px;font-weight:800;color:var(--purple)}
</style></head><body>
<div id="bar"><h1>Music</h1>
  <div class="tabs" id="tabs"><button data-tab="play" class="on">Play</button><button data-tab="songs">Songs</button><button data-tab="beat">Beat</button></div>
  <div id="who"></div><div id="stars"></div></div>

<div class="screen on" id="play">
  <div class="msg" id="pMsg">Tap the bars and the drums</div>
  <div class="xylo" id="pXylo"></div>
  <div class="drums" id="pDrums"></div>
</div>

<div class="screen" id="songs">
  <div class="chips" id="songChips"></div>
  <div class="top"><button class="round" id="sPlay" aria-label="show me again">👂</button><div class="msg" id="sMsg" style="min-width:420px"></div><div class="dots" id="sDots"></div></div>
  <div class="xylo small" id="sXylo"></div>
</div>

<div class="screen" id="beat">
  <div class="top"><button class="round" id="bPlay" aria-label="hear the beat again">👂</button><div class="msg" id="bMsg" style="min-width:420px"></div><div id="beatRound"></div></div>
  <div class="drums big" id="bDrums"></div>
</div>

<script>
'use strict';
// Forgiving touch-tap helper for X11 touchscreen: synthesize click if pointerdown+pointerup stays within 36px
(function(){
  let pt=null,lastClick=0;
  document.addEventListener("click",()=>{lastClick=Date.now();},true);
  document.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse")return;
    const b=e.target.closest("button,[role=button],.card,.item,.wd,.tile,.thing,.num,.shape,.opt,.fw");
    if(!b)return;
    pt={b,x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId};
  },true);
  document.addEventListener("pointerup",e=>{
    if(!pt||e.pointerId!==pt.id)return;
    const p=pt;pt=null;
    if(Date.now()-p.t>750||Math.hypot(e.clientX-p.x,e.clientY-p.y)>36)return;
    setTimeout(()=>{if(Date.now()-lastClick>80&&!p.b.disabled)p.b.click();},35);
  },true);
  document.addEventListener("pointercancel",()=>{pt=null;},true);
})();
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIVE=location.protocol.startsWith('http');
const NOTES=[{n:'C',f:261.63,c:'#e53935'},{n:'D',f:293.66,c:'#fb8c00'},{n:'E',f:329.63,c:'#fdd835'},{n:'F',f:349.23,c:'#43a047'},
             {n:'G',f:392.00,c:'#1e88e5'},{n:'A',f:440.00,c:'#3949ab'},{n:'B',f:493.88,c:'#8e24aa'},{n:'C',f:523.25,c:'#ec407a'}];
const DRUMS=[{k:'kick',n:'Boom',e:'🥁'},{k:'snare',n:'Tap',e:'🪘'},{k:'hat',n:'Tss',e:'🎩'},{k:'clap',n:'Clap',e:'👏'}];
// songs as bar indices 0..7 (C D E F G A B C); each inner list is one line the friend teaches
const SONGS=[
 {key:'twinkle',name:'Twinkle Twinkle',lines:[[0,0,4,4,5,5,4],[3,3,2,2,1,1,0],[4,4,3,3,2,2,1],[4,4,3,3,2,2,1],[0,0,4,4,5,5,4],[3,3,2,2,1,1,0]]},
 {key:'mary',name:'Mary Had a Little Lamb',lines:[[2,1,0,1,2,2,2],[1,1,1,2,4,4],[2,1,0,1,2,2,2],[2,1,1,2,1,0]]},
 {key:'hotcross',name:'Hot Cross Buns',lines:[[2,1,0],[2,1,0],[0,0,0,0,1,1,1,1],[2,1,0]]},
 {key:'row',name:'Row Your Boat',lines:[[0,0,0,1,2],[2,1,2,3,4],[7,7,7,4,4,4,2,2,2,0,0,0],[4,3,2,1,0]]},
 {key:'rain',name:'Rain Rain Go Away',lines:[[4,2,4,4,2],[4,4,2,5,4,4,2]]},
];
let DATA=null,tab='play',kid={id:'default',name:'',age:5},prog={stars:0,songs:{},beat:0},seq=0,audio=null,progLoaded=false;
const kt=m=>{try{parent.postMessage(m,'*');}catch(e){}};
const MP={get state(){return {tab,level:level(),song:song.s&&song.s.key,line:song.li,chunk:song.chunk.slice(),expect:song.expect,busy:tab==='songs'?song.busy:(tab==='beat'?beat.busy:false),pattern:beat.pattern.slice(),round:beat.pattern.length,bexpect:beat.expect,stars:prog.stars,kid:kid.id,last:lastPlayed};}};
window.MP=MP;
let lastPlayed=null;

// ---------- who is playing (D-008); progress follows the kid
let helloResolve;const hello=new Promise(r=>helloResolve=r);
window.addEventListener('message',e=>{const d=e.data||{};if(d.kt!=='hello')return;const prev=kid.id;
  if(d.kid&&d.kid.id)kid={id:d.kid.id,name:d.kid.name||'',age:+d.kid.age||5};else if(d.child&&d.child.name)kid.name=d.child.name;
  helloResolve();if(progLoaded&&kid.id!==prev)loadProg();});
function progKey(){return 'music.progress.'+kid.id;}
async function loadProg(){let p=null;
  if(LIVE){try{const r=await fetch('/api/store/music/'+encodeURIComponent(kid.id)+'/progress.json',{cache:'no-store'});if(r.ok)p=await r.json();}catch(e){}}
  if(!p){try{p=JSON.parse(localStorage.getItem(progKey())||'null');}catch(e){}}
  if(p&&typeof p==='object')prog={stars:+p.stars||0,songs:p.songs||{},beat:+p.beat||0};
  drawStars();drawChips();}
let saveT=null;
function saveProg(){clearTimeout(saveT);saveT=setTimeout(async()=>{const body=JSON.stringify(prog);try{localStorage.setItem(progKey(),body);}catch(e){}
  if(LIVE){try{await fetch('/api/store/music/'+encodeURIComponent(kid.id)+'/progress.json',{method:'PUT',headers:{'Content-Type':'application/json'},body});}catch(e){}}},400);}
function star(n){prog.stars+=n||1;drawStars();saveProg();kt({kt:'blip',f:720});}
function drawStars(){$('stars').textContent=prog.stars?('⭐'.repeat(Math.min(prog.stars,5))+(prog.stars>5?' '+prog.stars:'')):'';$('who').textContent=kid.name||'';}
function level(){const a=kid.age||5,s=prog.stars;if(a<=4&&s<12)return 1;if(a>=7||s>=30)return 3;return 2;}

// ---------- the friend's voice (mp3 lines) — one player, a new line cancels the old
function stopVoice(){seq++;if(audio){try{audio.pause();}catch(e){}audio=null;}}
function play(src){return new Promise(res=>{if(!src){res(false);return;}const a=new Audio(src);audio=a;a.onended=()=>res(true);a.onerror=()=>res(false);const p=a.play();if(p&&p.catch)p.catch(()=>res(false));});}
async function say(k){const my=++seq;const ok=await play(DATA&&DATA.voice[k]);return ok&&my===seq;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// ---------- WebAudio instruments: everything the child plays is made here, on the tablet
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(i,dur){try{const c=ac(),t=c.currentTime,f=NOTES[i].f,d=dur||.8;
  const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),g2=c.createGain();
  o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*3;g2.gain.value=.12;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);}catch(e){}}
function noiseBuf(len){const c=ac(),b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*len)),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function burst(len,type,freq,gain,at){const c=ac(),t=at||c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=noiseBuf(len);f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+len+.02);}
function drum(k){try{const c=ac(),t=c.currentTime;
  if(k==='kick'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+.22);g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.32);}
  else if(k==='snare'){burst(.18,'bandpass',1800,.7);const o=c.createOscillator(),g=c.createGain();o.frequency.value=185;g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.14);}
  else if(k==='hat'){burst(.06,'highpass',7000,.35);}
  else if(k==='clap'){burst(.05,'bandpass',1200,.6,t);burst(.05,'bandpass',1200,.5,t+.03);burst(.16,'bandpass',1200,.45,t+.06);}}catch(e){}}

// ---------- shared pieces: a xylophone and a drum row rendered into a container, with a tap handler
function wireInst(b,fn){let lastP=0;b.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();lastP=Date.now();fn();});b.onclick=()=>{if(Date.now()-lastP>250)fn();};}
function xylo(el,onTap){el.innerHTML=NOTES.map((n,i)=>'<button class="key" data-i="'+i+'" style="background:'+n.c+';height:'+(100-i*8)+'%">'+n.n+'</button>').join('');
  el.querySelectorAll('.key').forEach(b=>wireInst(b,()=>onTap(+b.dataset.i,b)));}
function drumRow(el,onTap){el.innerHTML=DRUMS.map(d=>'<button class="pad" data-k="'+d.k+'"><span>'+d.e+'</span>'+d.n+'</button>').join('');
  el.querySelectorAll('.pad').forEach(b=>wireInst(b,()=>onTap(b.dataset.k,b)));}
function light(b,ms){if(!b)return;b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),ms||260);}
function shakeIt(b){if(!b)return;b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');}
function buzz(){try{const c=ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=110;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.26);}catch(e){}}

// ---------- PLAY: free play
xylo($('pXylo'),(i,b)=>{tone(i);light(b);lastPlayed='n'+i;kt({kt:'blip',f:0});});
drumRow($('pDrums'),(k,b)=>{drum(k);light(b);lastPlayed=k;});

// ---------- SONGS: follow the lights
const song={s:null,li:0,ci:0,chunk:[],expect:0,misses:0,busy:false};
function chunkSize(){return [2,4,99][level()-1];}
function drawChips(){$('songChips').innerHTML=SONGS.map(s=>'<button class="chip'+(song.s&&song.s.key===s.key?' on':'')+(prog.songs[s.key]?' done':'')+'" data-k="'+s.key+'">'+E(s.name)+'</button>').join('');
  $('songChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>openSong(c.dataset.k));}
function drawDots(){const s=song.s;if(!s){$('sDots').innerHTML='';return;}$('sDots').innerHTML=s.lines.map((_,i)=>'<i class="'+(i<song.li?'done':(i===song.li?'now':''))+'"></i>').join('');}
async function openSong(key){
  stopVoice();song.s=SONGS.find(s=>s.key===key);song.li=0;song.ci=0;song.misses=0;song.busy=true;drawChips();drawDots();
  $('sMsg').textContent=song.s.name;
  await say('song_'+key);
  if(song.s&&song.s.key===key)teach();
}
async function teach(replay,keep){
  // keep = after a miss: light only what is left of the chunk and keep the child's place, so good taps are not thrown away
  const s=song.s;if(!s)return;const line=s.lines[song.li];
  song.chunk=line.slice(song.ci,song.ci+chunkSize());if(!keep)song.expect=0;song.busy=true;
  $('sMsg').textContent='Watch the lights…';$('sXylo').querySelectorAll('.key').forEach(k=>k.classList.remove('hint'));
  const my=++seq;
  if(!replay)await play(DATA.voice.listen);
  for(const i of song.chunk.slice(keep?song.expect:0)){if(my!==seq||song.s!==s){if(song.s===s)song.busy=false;return;}const b=$('sXylo').querySelector('.key[data-i="'+i+'"]');tone(i,.7);light(b,320);await wait(520);}
  if(my!==seq||song.s!==s){if(song.s===s)song.busy=false;return;}
  await wait(120);
  if(my!==seq||song.s!==s||tab!=='songs')return;
  $('sMsg').textContent='Your turn!';song.busy=false;
  await play(DATA.voice.yourturn);
}
xylo($('sXylo'),async(i,b)=>{
  if(!song.s){tone(i);light(b);return;}
  if(song.busy)return;
  const want=song.chunk[song.expect];
  if(i===want){
    tone(i);light(b);song.expect++;song.misses=0;$('sXylo').querySelectorAll('.key').forEach(k=>k.classList.remove('hint'));
    if(song.expect<song.chunk.length)return;
    // chunk done: next chunk, next line, or the whole song
    song.busy=true;song.ci+=song.chunk.length;
    const s=song.s,line=s.lines[song.li];
    if(song.ci>=line.length){
      song.li++;song.ci=0;star(1);drawDots();
      if(song.li>=s.lines.length){
        prog.songs[s.key]=(prog.songs[s.key]||0)+1;saveProg();drawChips();
        $('sMsg').textContent='You played the whole song!';await say('song_done');
        if(song.s!==s)return;
        await playSong(s);if(song.s!==s)return;
        song.li=0;song.ci=0;drawDots();$('sMsg').textContent='Again? Watch the lights…';await wait(600);if(song.s===s)teach(true);return;
      }
      $('sMsg').textContent=['Yes!','Lovely!','Keep going!'][song.li%3];await say(song.li%2?'lovely':'yes');
    }else{await wait(350);}
    if(song.s===s)teach(true);
  }else{
    buzz();shakeIt(b);song.misses++;kt({kt:'blip',f:0});
    $('sMsg').textContent=song.misses>=2?'This one…':'Not that one…';
    if(song.misses>=2){const h=$('sXylo').querySelector('.key[data-i="'+want+'"]');if(h)h.classList.add('hint');}
    else{song.busy=true;const s=song.s;await say('again');if(song.s===s)teach(true,true);}
  }
});
async function playSong(s){const my=++seq;for(const line of s.lines){for(const i of line){if(my!==seq)return;const b=$('sXylo').querySelector('.key[data-i="'+i+'"]');tone(i,.6);light(b,260);await wait(380);}await wait(250);}}
$('sPlay').onclick=()=>{if(song.s){stopVoice();teach(true,true);}};   // audit fix 1: 👂 replays even mid-lesson, like #bPlay   // 👂 shows what is left of the chunk

// ---------- BEAT: drum echo
const beat={pattern:[],expect:0,busy:false,best:0};
function beatLen(){const L=level();return Math.min(2+Math.floor(beat.best/2),L===1?3:(L===2?5:7));}
async function newBeat(grow){
  stopVoice();beat.busy=true;beat.expect=0;
  const len=grow?Math.min(beat.pattern.length+1,[3,5,7][level()-1]):beatLen();
  beat.pattern=Array.from({length:len},()=>DRUMS[Math.floor(Math.random()*DRUMS.length)].k);
  $('beatRound').textContent=len+' beats';await showBeat();
}
async function showBeat(){
  beat.busy=true;$('bMsg').textContent='Listen…';const my=++seq;
  await play(DATA.voice.beat);
  for(const k of beat.pattern){if(my!==seq)return;const b=$('bDrums').querySelector('.pad[data-k="'+k+'"]');drum(k);light(b,300);await wait(560);}
  if(my!==seq)return;
  await wait(100);
  if(my!==seq||tab!=='beat')return;
  $('bMsg').textContent='Your turn!';beat.expect=0;beat.busy=false;
  await play(DATA.voice.yourturn);
}
drumRow($('bDrums'),async(k,b)=>{
  if(beat.busy){return;}
  if(k===beat.pattern[beat.expect]){
    drum(k);light(b);beat.expect++;
    if(beat.expect<beat.pattern.length)return;
    beat.busy=true;beat.best=Math.max(beat.best,beat.pattern.length);prog.beat=Math.max(prog.beat,beat.pattern.length);star(1);
    $('bMsg').textContent="You've got the beat!";await say('beat_done');await wait(300);newBeat(true);
  }else{
    buzz();shakeIt(b);beat.busy=true;$('bMsg').textContent='Not that one — listen again';await say('again');showBeat();
  }
});
